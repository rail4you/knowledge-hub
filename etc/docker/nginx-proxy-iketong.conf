# ============================================================
# nginx-proxy-iketong.conf - KnowledgeHub 在 47.99.245.49 的容器内 Nginx 配置
# ============================================================
#
# 与 nginx-proxy.conf 的区别：
#   - 只监听 80（容器内），宿主机映射到 4200，由宝塔终结 HTTPS
#   - 不启用 SSL / 不强制 HTTP→HTTPS（宝塔做）
#   - 不绑定 server_name（宝塔已经按域名路由）
#   - 接收宝塔传递的 X-Forwarded-Proto 头部（让 API/ABP 知道是 https 请求）
#
# 部署路径：远程 ~/knowledgehub-iketong/nginx-proxy.conf
# ============================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # ABP 通过 `__tenant` 请求头传递租户上下文，nginx 默认会丢弃
    # 含下划线的请求头（underscores_in_headers off），必须显式开启。
    underscores_in_headers on;

    # nginx 默认 mime.types 不含 .mjs/.wasm/.unityweb
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
        application/octet-stream unityweb;
    }

    # 设置默认 scheme 为 https（由宝塔反代传递 X-Forwarded-Proto 时此值被覆盖）
    set $scheme_default "https";

    # 使用 Docker 内部 DNS，配合变量实现动态解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream knowledgehub-api;

    # --------------------------------------------------------
    # 仿真实训 WASM 本地镜像：必须在 location / 之前声明，
    # ^~ 修饰符禁用正则表达式匹配，优先级高于 SPA 的 location /。
    # --------------------------------------------------------
    location ^~ /wasm/ {
        alias /usr/share/nginx/html/wasm/;
        autoindex off;
        index index.html;
        try_files $uri $uri/ =404;

        # 启用 COOP/COEP，供 Unity 多线程 build 用 SharedArrayBuffer。
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # 长期缓存：Unity 生成的文件名固定不变（无 hash 后缀）
        expires 1y;

        # 入口 HTML 永不缓存（loader 必须每次重新解析）。
        location ~* /wasm/[^/]+/index\.html$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }
    }

    # Angular 站点（首页 + 管理端）
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html =404;

        # 禁用缓存，确保总是获取最新版本
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Angular 运行时环境配置
    location /getEnvConfig {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Content-Type application/json;
        alias /usr/share/nginx/html/dynamic-env.json;
    }

    # 上传的文件（视频/文档/图片等）—— 视频索引需要公网可访问的绝对 URL
    location /uploads/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        # 关键：把宝塔反代传过来的 scheme/host/port 透传给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # Account 页面：分两类处理。
    #
    # (1) SPA 的登录/注册等路由必须交给 Angular（精确匹配 = 优先级高于下方正则）。
    #     本项目已迁移到「纯 Angular 密码授权」：自研登录组件直接 POST /connect/token
    #     换取 bearer token（见 core/auth/custom-auth.service.ts）。
    #     若这些路径被下面的正则截给后端 Razor 页，用户会走“服务端 cookie 登录”：
    #     只写 cookie、不下发 bearer token，SPA 判定未登录，于是刚进工作台就被弹回登录页。
    #
    # (2) 其余 /account/* 仍交后端（Razor 遗留路径福底）。
    location = /account/login {
        root   /usr/share/nginx/html;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /account/register {
        root   /usr/share/nginx/html;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /account/forgot-password {
        root   /usr/share/nginx/html;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /account/reset-password {
        root   /usr/share/nginx/html;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /account/manage {
        root   /usr/share/nginx/html;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Account 页面（后端 Razor 遗留路径，如 /Account/Login 服务端页面）
    location ~* ^/account/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ABP 静态资源
    location /libs/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /__bundles/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ABP 动态脚本
    location ~ ^/(Abp|ApplicationLocalizationScript|ApplicationConfigurationScript|ServiceProxyScript|Error) {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;
    }

    # OpenIddict Connect 端点
    location /connect/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Hangfire Dashboard
    location /hangfire {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        client_max_body_size 200m;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # OpenID 配置发现
    location /.well-known/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 直播 WebSocket 信令端点
    location /api/recruitment-live/ws {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme_default;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 健康检查
    location /health-status {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}