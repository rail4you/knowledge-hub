# ============================================================
# docker-compose.yml - KnowledgeHub 生产环境部署
# ============================================================
#
# 架构：Nginx 代理模式，所有外部访问通过 80 端口
#   浏览器 → Angular(Nginx:80) → API(内部:44354)
#   API 不对外暴露端口，仅通过 Nginx 反向代理访问
#
# 远程目录结构：
#   ~/knowledgehub/
#   ├── docker-compose.yml      ← 本文件
#   ├── .env                    ← 环境变量（从 .env.example 复制）
#   ├── nginx-proxy.conf        ← Nginx 代理配置
#   ├── dynamic-env.json        ← Angular 运行时配置（由 deploy.sh 自动生成）
#   ├── deploy.sh               ← 管理脚本
#   ├── uploads/                ← 文件上传目录
#   ├── postgres_data/          ← PostgreSQL 数据（bind mount，down -v 安全）
#   └── meilisearch_data/       ← 搜索引擎数据
#
# 使用方式：
#   ./deploy.sh up              # 启动所有服务
#   ./deploy.sh down            # 停止所有服务
#   ./deploy.sh migrate         # 执行数据库迁移
#   ./deploy.sh logs [service]  # 查看日志
#   ./deploy.sh status          # 查看状态
#
# ============================================================

services:

  # ----------------------------------------------------------
  # Angular UI — Nginx 静态文件 + API 反向代理（端口 80）
  # nginx-proxy.conf 同时处理：
  #   - Angular 静态文件
  #   - /api/* → API 容器
  #   - /connect/* → API 容器（OpenIddict）
  #   - /.well-known/* → API 容器（OIDC 发现）
  # ----------------------------------------------------------
  knowledgehub-angular:
    image: ${REGISTRY}/knowledgehub-angular:${IMAGE_TAG}
    container_name: knowledgehub-angular
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dynamic-env.json:/usr/share/nginx/html/dynamic-env.json:ro
      - ./certs:/etc/nginx/certs:ro
      # 仿真实训 WASM 本地镜像（生产由 Nginx 直接读取此目录）
      - ./wasm-mirrors:/usr/share/nginx/html/wasm:ro
    depends_on:
      - knowledgehub-api
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # HttpApi.Host — 后端 API（仅内部网络，不暴露端口）
  # 所有外部请求通过 Angular 容器的 Nginx 代理转发
  # ----------------------------------------------------------
  knowledgehub-api:
    image: ${REGISTRY}/knowledgehub-api:${IMAGE_TAG}
    container_name: knowledgehub-api
    hostname: knowledgehub-api
    # 内存上限：宿主机仅 4GB，dotnet 常驻 ~500MB 且缓慢增长，封顶 1.5g；
    # 超限由内核 OOM-killer 只杀本容器（自动重启），不再拖死整机。
    # 注意：.NET 会按 cgroup limit 自动收缩 GC heap，无需额外配置。
    mem_limit: 1.5g
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:44354
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      # 应用 URL（浏览器实际访问地址，即 Nginx 的地址）
      - App__SelfUrl=${PUBLIC_URL}
      - App__HealthCheckUrl=http://knowledgehub-api:44354/health-status
      - App__AngularUrl=${PUBLIC_URL}
      - App__CorsOrigins=${PUBLIC_URL}
      - App__RedirectAllowedUrls=${PUBLIC_URL}
      # 上传文件大小上限（字节，默认 500MB）。超大 PPTX 由 PptxImagePreprocessor 预压缩。
      - App__MaxFileSizeBytes=${UPLOAD_MAX_FILE_SIZE_BYTES:-524288000}
      # AuthServer（外部可访问地址，用于 token 验证）
      - AuthServer__Authority=${PUBLIC_URL}/
      - AuthServer__RequireHttpsMetadata=false
      # 数据库
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=KnowledgeHub;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Redis__Configuration=redis
      # Meilisearch
      - Meilisearch__Host=http://meilisearch:7700
      - Meilisearch__ApiKey=${MEILISEARCH_MASTER_KEY}
      - Meilisearch__IndexName=documents
      - Meilisearch__EmbeddingDimension=1024
      - Meilisearch__EmbeddingApiKey=${EMBEDDING_API_KEY}
      # LiteParse 文档解析服务（独立容器，仅内部网络）
      - Liteparse__Host=http://liteparse:5707
      - Liteparse__RequestTimeoutSeconds=${LITEPARSE_TIMEOUT}
      - Liteparse__Dpi=${LITEPARSE_DPI}
      # Gotenberg 文档转 PDF（预览转换，仅内部网络）
      - OfficeConversion__BaseUrl=http://gotenberg:3000
      # 转换并发：默认每类服务 1（严格串行），可在运行期通过 API 调整
      - OfficeConversion__MaxConcurrentConversions=1
      # 在线预览最大源文件大小（500MB）：超大 PPTX 会先经 ffmpeg 预压缩成 light 文件
      # 再转换，故可放开到 500MB。真正的防爆由 EnablePptxPreprocess 承担。
      - OfficeConversion__MaxPreviewFileSizeBytes=524288000
      # 大文件（>30MB）转换时降采样图片到 150DPI + JPEG 75，减小 PDF 体积与处理负担
      - OfficeConversion__ReduceImageResolutionThresholdBytes=31457280
      - OfficeConversion__MaxImageResolutionDpi=150
      - OfficeConversion__JpegQuality=75
      # PPTX 大媒体预压缩：>30MB 的 PPTX 先用 ffmpeg 把 GIF/大图压小（→light.pptx）
      # 再喂给 LibreOffice，显著降低峰值内存（实测 203MB→4.7MB，峰值 5GB→0.7GB）
      - OfficeConversion__EnablePptxPreprocess=true
      - OfficeConversion__PptxPreprocessThresholdBytes=31457280
      - OfficeConversion__PptxMediaCompressThresholdBytes=524288
      - OfficeConversion__PptxMaxImageDimension=900
      - OfficeConversion__PptxJpegQuality=4
      - OfficeConversion__StripEmbeddedFonts=true
      # 后台预热周期（分钟）：0 = 关闭
      - OfficeConversion__ReprocessPeriodMinutes=5
      - OfficeConversion__ReprocessBatchSize=5
      # Hangfire Dashboard：默认关闭公网访问（仅回环）
      - Hangfire__DashboardAllowPublic=false
      # Qwen API
      - Qwen__ApiKey=${QWEN_API_KEY}
      - Qwen__BaseUrl=${QWEN_BASE_URL}
      - Qwen__Model=${QWEN_MODEL}
      # OSS 阿里云对象存储
      - Oss__Endpoint=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      - Oss__AccessKeyId=${OSS_ACCESS_KEY_ID}
      - Oss__AccessKeySecret=${OSS_ACCESS_KEY_SECRET}
      - Oss__BucketName=${OSS_BUCKET_NAME:-kg-edu}
      - Oss__UploadPath=${OSS_UPLOAD_PATH:-knowledgehub}
      # 安全
      - AuthServer__CertificatePassPhrase=${JWT_CERTIFICATE_PASSWORD}
      - StringEncryption__DefaultPassPhrase=${STRING_ENCRYPTION_PASSPHRASE}
      # 招聘直播 WebRTC：TURN 中继凭据（coturn time-limited credential）
      - RecruitmentLive__Turn__Url=turn:${PUBLIC_IP:-119.45.170.4}:3478?transport=udp
      - RecruitmentLive__Turn__UrlTcp=turn:${PUBLIC_IP:-119.45.170.4}:3478?transport=tcp
      - RecruitmentLive__Turn__Secret=${TURN_SECRET:-change-me}
      - RecruitmentLive__Turn__ValiditySeconds=21600
      # 账号：禁用用户自助注册（登录页隐藏“注册新用户”提示/按钮）
      - Settings__Abp.Account.IsSelfRegistrationEnabled=false
      # 日志
      - Serilog__MinimumLevel__Default=Information
      # 仿真实训 WASM 本地镜像（由 Kestrel 兜底读取；生产主要由 Nginx 直接静态托管）
      - WasmMirror__RootPath=/app/wasm-mirrors
    volumes:
      - ./uploads:/app/uploads
      - ./wasm-mirrors:/app/wasm-mirrors:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # Meilisearch — 全文搜索引擎
  # ----------------------------------------------------------
  meilisearch:
    # v1.8.0 起 charabia 默认关闭中文拼音归一化；< v1.8 会把「肺/痱」等同音字
    # 归一为同一拼音 token，导致同音字互相召回。不要降回 v1.6。
    image: getmeili/meilisearch:v1.39.0
    container_name: meilisearch
    hostname: meilisearch
    platform: linux/amd64
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_DB_PATH=/meili_data
      - MEILI_HTTP_ADDR=0.0.0.0:7700
    volumes:
      - ./meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # LiteParse — 文档解析服务（独立容器，外部项目提供镜像）
  # 仅内部网络可达（5707），API 通过主机名 `liteparse` 访问
  # 镜像路径：${LITEPARSE_IMAGE}
  # 注意：上游镜像可能不提供 /health 端点，这里用 TCP 端口探测
  # 默认值在 deploy.sh 中自动注入到 .env，无需在 compose 文件里写
  # ----------------------------------------------------------
  knowledgehub-liteparse:
    image: ${LITEPARSE_IMAGE}
    container_name: knowledgehub-liteparse
    hostname: liteparse
    platform: linux/amd64
    ports:
      # 仅绑定宿主机回环地址：供本机 dev API（LiteParseOptions 默认 http://localhost:15000）访问
      - "127.0.0.1:15000:5707"
    healthcheck:
      # 用 python3 探测 5707 端口连通性（上游镜像无 /health 端点）
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5707)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # coturn — WebRTC TURN 媒体中继（招聘直播）
  # 解决双方位于对称/严格 NAT（校园网、家庭宽带、运营商 CGNAT）后
  # 仅靠 STUN 无法建立 P2P 媒体连接的问题：ICE 无法直连时媒体经此中继。
  # 认证：static-auth-secret + time-limited credential
  #   （GetIceServersAsync 用 HMAC-SHA1(secret, username) 动态签发）。
  # 注意：使用 host 网络模式以直接绑定 UDP 中继端口段；
  #       云安全组/防火墙必须放行 UDP 3478、TCP 3478、UDP/TCP 49160-49200。
  # ----------------------------------------------------------
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    hostname: coturn
    network_mode: host
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --external-ip=${PUBLIC_IP:-119.45.170.4}
      --realm=knowledgehub
      --fingerprint
      --no-multicast-peers
      --no-tls --no-dtls
      --static-auth-secret=${TURN_SECRET:-change-me} --use-auth-secret
    restart: unless-stopped

  # ----------------------------------------------------------
  # Gotenberg — Office 文档转 PDF（预览转换服务）
  # 仅内部网络可达（3000），API 通过主机名 `gotenberg` 访问
  # 镜像路径：${GOTENBERG_IMAGE}，默认 ${REGISTRY}/knowledgehub-gotenberg:${IMAGE_TAG}
  #   （自定义镜像含中文字体，构建见 etc/docker/Dockerfile.gotenberg；
  #     可覆盖为官方 gotenberg/gotenberg:8，但中文会渲染成方框）
  # ----------------------------------------------------------
  knowledgehub-gotenberg:
    image: ${GOTENBERG_IMAGE}
    container_name: knowledgehub-gotenberg
    hostname: gotenberg
    platform: linux/amd64
    # 内存上限：LibreOffice 转大文件是已知的内存 spike 来源（预处理后峰值约 0.7GB）；
    # 封顶 800m，超大转换失败只重启本容器，不再拖死整机。
    mem_limit: 800m
    environment:
      # LibreOffice 处理 N 个文件后重启进程，避免内存泄漏累积
      - LIBREOFFICE_RESTART_AFTER=50
      # 单个请求超时：默认 30s，大 PPTX（含大量图片/复杂版式）LibreOffice 转换可能超过 30s，
      # 超时会返回 503 "The request exceeded the time limit"。调高到 300s。
      - API_TIMEOUT=300s
    ports:
      # 仅绑定宿主机回环地址：供 deploy.sh 健康检查探测 /health，不对外暴露
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # DbMigrator — 数据库迁移 & OpenIddict 种子数据（一次性任务）
  # 通过 ./deploy.sh migrate 手动执行
  # ----------------------------------------------------------
  db-migrator:
    image: ${REGISTRY}/knowledgehub-db-migrator:${IMAGE_TAG}
    container_name: knowledgehub-db-migrator
    environment:
      - OpenIddict__Applications__KnowledgeHub_App__ClientId=KnowledgeHub_App
      - OpenIddict__Applications__KnowledgeHub_App__RootUrl=${PUBLIC_URL}
      - OpenIddict__Applications__KnowledgeHub_App__RedirectAllowedUrls=${PUBLIC_URL}
      - OpenIddict__Applications__KnowledgeHub_Swagger__ClientId=KnowledgeHub_Swagger
      - OpenIddict__Applications__KnowledgeHub_Swagger__RootUrl=${PUBLIC_URL}
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=KnowledgeHub;Username=postgres;Password=${POSTGRES_PASSWORD}
      - AuthServer__CertificatePassPhrase=${JWT_CERTIFICATE_PASSWORD}
      - StringEncryption__DefaultPassPhrase=${STRING_ENCRYPTION_PASSPHRASE}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - abp-network

  # ----------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=KnowledgeHub
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: redis
    hostname: redis
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - abp-network

# ----------------------------------------------------------
# 注意：数据持久化全部使用 bind mount（./xxx），不使用 named volume
# 这样即使误执行 docker compose down -v 也不会删除数据库数据
# ----------------------------------------------------------
networks:
  abp-network:
    driver: bridge
