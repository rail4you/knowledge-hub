# ============================================================
# docker-compose-iketong.yml - KnowledgeHub 在 47.99.245.49 的部署
# ============================================================
#
# 与 docker-compose.yml 的区别（119.45.170.4 生产服务器）：
#   - PostgreSQL 宿主机端口：5433（避开 kg-edu-db 的 5432）
#   - Redis 宿主机端口：6380（避免冲突）
#   - Meilisearch 宿主机端口：7701
#   - Angular 容器：4200（避开宝塔 Nginx 的 80/443；由宝塔反代）
#   - LiteParse 宿主机端口：15001（避开 kg-edu 的 15000）
#   - Gotenberg 宿主机端口：3001
#   - 容器内 Nginx 不再监听 80/443，由宝塔面板统一接管 TLS 终结
#
# 远程目录结构：
#   ~/knowledgehub-iketong/
#   ├── docker-compose.yml       ← 本文件（重命名后）
#   ├── .env                     ← 从 .env.iketong 复制
#   ├── nginx-proxy.conf         ← 容器内 Nginx 配置（只听 4200）
#   ├── dynamic-env.json         ← Angular 运行时配置
#   ├── deploy.sh                ← 管理脚本（与生产服务器共用同一份）
#   ├── uploads/                 ← 文件上传目录（从生产服务器迁移）
#   ├── postgres_data/           ← PostgreSQL 数据
#   ├── meilisearch_data/        ← 搜索引擎数据
#   ├── redis_data/              ← Redis 数据（Hangfire）
#   └── wasm-mirrors/            ← 仿真实训 WASM 镜像
# ============================================================

services:

  # ----------------------------------------------------------
  # Angular UI — Nginx 静态文件 + API 反向代理
  # 只听 4200（避开宝塔 80/443），由宝塔站点 www.iketong.com 反代到此
  # ----------------------------------------------------------
  knowledgehub-angular:
    image: ${REGISTRY}/knowledgehub-angular:${IMAGE_TAG}
    container_name: knowledgehub-angular
    ports:
      - "${ANGRY_HOST_PORT:-4200}:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dynamic-env.json:/usr/share/nginx/html/dynamic-env.json:ro
      - ./certs:/etc/nginx/certs:ro
      # 仿真实训 WASM 本地镜像
      - ./wasm-mirrors:/usr/share/nginx/html/wasm:ro
    depends_on:
      - knowledgehub-api
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # HttpApi.Host — 后端 API（仅内部网络，不暴露端口）
  # ----------------------------------------------------------
  knowledgehub-api:
    image: ${REGISTRY}/knowledgehub-api:${IMAGE_TAG}
    container_name: knowledgehub-api
    hostname: knowledgehub-api
    mem_limit: 1.5g
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:44354
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - App__SelfUrl=${PUBLIC_URL}
      - App__HealthCheckUrl=http://knowledgehub-api:44354/health-status
      - App__AngularUrl=${PUBLIC_URL}
      # 学校专属域名一并进白名单：学校域名下的 SPA 与 API 同源（宝塔反代同一容器），
      # 这里主要是给 OIDC 授权码流程 / 跨域场景留口子。
      - App__CorsOrigins=${PUBLIC_URL},${SCHOOL_DOMAINS}
      - App__RedirectAllowedUrls=${PUBLIC_URL},${SCHOOL_DOMAINS}
      - App__MaxFileSizeBytes=${UPLOAD_MAX_FILE_SIZE_BYTES:-524288000}
      - AuthServer__Authority=${PUBLIC_URL}/
      - AuthServer__RequireHttpsMetadata=false
      # 数据库（容器内仍 5432，因为 Docker 网络内部互通）
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=KnowledgeHub;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=50;Timeout=15;Command Timeout=30
      - ConnectionStrings__Hangfire=Host=postgres;Port=5432;Database=KnowledgeHub;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=20;Timeout=15;Command Timeout=30
      - Redis__Configuration=redis
      - Hangfire__Storage=Redis
      - Hangfire__Workers__Default=2
      - Hangfire__Workers__Conversion=1
      - Hangfire__Workers__Ai=2
      - Hangfire__Workers__Media=2
      - Hangfire__Workers__Indexing=2
      - Meilisearch__Host=http://meilisearch:7700
      - Meilisearch__ApiKey=${MEILISEARCH_MASTER_KEY}
      - Meilisearch__IndexName=documents
      - Meilisearch__EmbeddingDimension=1024
      - Meilisearch__EmbeddingApiKey=${EMBEDDING_API_KEY}
      - Liteparse__Host=http://liteparse:5707
      - Liteparse__RequestTimeoutSeconds=${LITEPARSE_TIMEOUT}
      - Liteparse__Dpi=${LITEPARSE_DPI}
      - OfficeConversion__BaseUrl=http://gotenberg:3000
      - OfficeConversion__MaxConcurrentConversions=1
      - OfficeConversion__MaxPreviewFileSizeBytes=524288000
      - OfficeConversion__ReduceImageResolutionThresholdBytes=31457280
      - OfficeConversion__MaxImageResolutionDpi=150
      - OfficeConversion__JpegQuality=75
      - OfficeConversion__EnablePptxPreprocess=true
      - OfficeConversion__PptxPreprocessThresholdBytes=31457280
      - OfficeConversion__PptxMediaCompressThresholdBytes=524288
      - OfficeConversion__PptxMaxImageDimension=900
      - OfficeConversion__PptxJpegQuality=4
      - OfficeConversion__StripEmbeddedFonts=true
      - OfficeConversion__ReprocessPeriodMinutes=5
      - OfficeConversion__ReprocessBatchSize=5
      - Hangfire__DashboardAllowPublic=false
      - Qwen__ApiKey=${QWEN_API_KEY}
      - Qwen__BaseUrl=${QWEN_BASE_URL}
      - Qwen__Model=${QWEN_MODEL}
      - Qwen__MaxConcurrentRequests=${QWEN_MAX_CONCURRENT:-3}
      - Oss__Endpoint=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      - Oss__AccessKeyId=${OSS_ACCESS_KEY_ID}
      - Oss__AccessKeySecret=${OSS_ACCESS_KEY_SECRET}
      - Oss__BucketName=${OSS_BUCKET_NAME:-kg-storage}
      - Oss__UploadPath=${OSS_UPLOAD_PATH:-knowledgehub}
      - AuthServer__CertificatePassPhrase=${JWT_CERTIFICATE_PASSWORD}
      - AuthServer__CertificatePath=openiddict.production.pfx
      - StringEncryption__DefaultPassPhrase=${STRING_ENCRYPTION_PASSPHRASE}
      # 招聘直播 WebRTC：TURN 中继凭据
      - RecruitmentLive__Turn__Url=turn:${PUBLIC_IP:-47.99.245.49}:3478?transport=udp
      - RecruitmentLive__Turn__UrlTcp=turn:${PUBLIC_IP:-47.99.245.49}:3478?transport=tcp
      - RecruitmentLive__Turn__Secret=${TURN_SECRET:-change-me}
      - RecruitmentLive__Turn__ValiditySeconds=21600
      - Settings__Abp.Account.IsSelfRegistrationEnabled=false
      - Serilog__MinimumLevel__Default=Information
      - WasmMirror__RootPath=/app/wasm-mirrors
      - Storage__RootPath=${STORAGE_ROOT_PATH:-/app/uploads}
    volumes:
      - ${STORAGE_HOST_DIR:-./uploads}:${STORAGE_ROOT_PATH:-/app/uploads}
      - ./wasm-mirrors:/app/wasm-mirrors:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # Meilisearch — 全文搜索引擎
  # 宿主机端口 7701（避开 kg_edu 的 7700 占位）
  # ----------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.39.0
    container_name: meilisearch
    hostname: meilisearch
    platform: linux/amd64
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_DB_PATH=/meili_data
      - MEILI_HTTP_ADDR=0.0.0.0:7700
    volumes:
      - ./meilisearch_data:/meili_data
    ports:
      # 宿主机 7701 → 容器 7700（deploy.sh 健康检查使用）
      - "127.0.0.1:${MEILISEARCH_HOST_PORT:-7701}:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # LiteParse — 文档解析服务
  # 宿主机端口 15001（避开 kg-edu 的 15000）
  # ----------------------------------------------------------
  knowledgehub-liteparse:
    image: ${LITEPARSE_IMAGE}
    container_name: knowledgehub-liteparse
    hostname: liteparse
    platform: linux/amd64
    ports:
      - "127.0.0.1:${LITEPARSE_HOST_PORT:-15001}:5707"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5707)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # coturn — WebRTC TURN 媒体中继（招聘直播）
  # 使用 host 网络模式，云安全组需放行 UDP/TCP 3478 + 49160-49200
  # ----------------------------------------------------------
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    hostname: coturn
    network_mode: host
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --external-ip=${PUBLIC_IP:-47.99.245.49}
      --realm=knowledgehub
      --fingerprint
      --no-multicast-peers
      --no-tls --no-dtls
      --static-auth-secret=${TURN_SECRET:-change-me} --use-auth-secret
    restart: unless-stopped

  # ----------------------------------------------------------
  # Gotenberg — Office 文档转 PDF
  # 宿主机端口 3001
  # ----------------------------------------------------------
  knowledgehub-gotenberg:
    image: ${GOTENBERG_IMAGE}
    container_name: knowledgehub-gotenberg
    hostname: gotenberg
    platform: linux/amd64
    mem_limit: 800m
    environment:
      - LIBREOFFICE_RESTART_AFTER=50
      - API_TIMEOUT=300s
    ports:
      - "127.0.0.1:${GOTENBERG_HOST_PORT:-3001}:3000"
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # DbMigrator — 数据库迁移 & OpenIddict 种子数据（一次性任务）
  # ----------------------------------------------------------
  db-migrator:
    image: ${REGISTRY}/knowledgehub-db-migrator:${IMAGE_TAG}
    container_name: knowledgehub-db-migrator
    environment:
      - OpenIddict__Applications__KnowledgeHub_App__ClientId=KnowledgeHub_App
      - OpenIddict__Applications__KnowledgeHub_App__RootUrl=${PUBLIC_URL}
      - OpenIddict__Applications__KnowledgeHub_App__RedirectAllowedUrls=${PUBLIC_URL},${SCHOOL_DOMAINS}
      - OpenIddict__Applications__KnowledgeHub_Swagger__ClientId=KnowledgeHub_Swagger
      - OpenIddict__Applications__KnowledgeHub_Swagger__RootUrl=${PUBLIC_URL}
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=KnowledgeHub;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=10;Timeout=15;Command Timeout=300
      - AuthServer__CertificatePassPhrase=${JWT_CERTIFICATE_PASSWORD}
      - StringEncryption__DefaultPassPhrase=${STRING_ENCRYPTION_PASSPHRASE}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - abp-network

  # ----------------------------------------------------------
  # PostgreSQL 16
  # 宿主机端口 5433（避开 kg-edu-db 的 5432 占用）
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=KnowledgeHub
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - abp-network

  # ----------------------------------------------------------
  # Redis — Hangfire 作业存储
  # 宿主机端口 6380
  # ----------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: redis
    hostname: redis
    platform: linux/amd64
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - abp-network

networks:
  abp-network:
    driver: bridge