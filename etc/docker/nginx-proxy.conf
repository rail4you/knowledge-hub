# HTTP → HTTPS 重定向
server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    # 不启用 http2：WebSocket（信令服务器）依赖 HTTP/1.1 Upgrade 机制，
    # HTTP/2 的 WebSocket (RFC 8441 extended CONNECT) 兼容性差，
    # 会导致 wss:// 连接被浏览器拒绝或 nginx 转发失败
    server_name  _;

    # nginx 默认 mime.types 不含 .mjs，导致 pdfjs worker 被浏览器拒绝加载
    # 注意：必须先用 include 引入默认类型，否则所有文件都会变成 download
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
        application/octet-stream unityweb;
    }

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # 使用 Docker 内部 DNS，配合变量实现动态解析
    # 避免 API 容器重建后 IP 变化导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream knowledgehub-api;

    # --------------------------------------------------------
    # 仿真实训 WASM 本地镜像：必须在 location / 之前声明，
    # ^~ 修饰符禁用正则表达式匹配，优先级高于 SPA 的 location /。
    # 不在此范围内的请求被交回 try_files → /index.html 兜底。
    # 注：嵌套 location 中 add_header 会替换外层所有 add_header，
    # 所以 index.html 上需要把 COOP/COEP/Cache-Control 一并重写。
    # --------------------------------------------------------
    location ^~ /wasm/ {
        alias /usr/share/nginx/html/wasm/;
        autoindex off;
        index index.html;
        try_files $uri $uri/ =404;

        # 启用 COOP/COEP，供 Unity 多线程 build 用 SharedArrayBuffer。
        # 注意：COEP 会拦截未声明 CORP/CORS 的第三方资源。
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # 长期缓存：Unity 生成的文件名固定不变（无 hash 后缀），
        # .unityweb / .wasm / .framework.js / .loader.js 都能跨会话缓存。
        # expires = add_header "Cache-Control: max-age=31536000" + "Expires: ..."
        # index.html 是个例外（loader 必须每次重新解析），下方的嵌套 location 会覆盖。
        expires 1y;

        # 入口 HTML 永不缓存（loader 必须每次重新解析）。
        # 嵌套 location 的 add_header 会覆盖外层，故这里一并补全 headers。
        location ~* /wasm/[^/]+/index\.html$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }
    }

    # Angular 站点（首页 + 管理端）
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html =404;

        # 禁用缓存，确保总是获取最新版本
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Angular 运行时环境配置
    location /getEnvConfig {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Content-Type application/json;
        alias /usr/share/nginx/html/dynamic-env.json;
    }

    # Account 页面（登录、注册等）- 大小写不敏感匹配
    location ~* ^/account/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ABP 静态资源（libs, bundles 等）
    location /libs/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /__bundles/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ABP 动态脚本（无扩展名，需代理到 API）
    location ~ ^/(Abp|ApplicationLocalizationScript|ApplicationConfigurationScript|ServiceProxyScript|Error) {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenIddict Connect 端点（登录、注销、Token 等）
    location /connect/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hangfire Dashboard（转换队列监控）
    # 默认仅允许本机/回环访问（安全）；如需公网访问请调整 allow 段并配合鉴权。
    location /hangfire {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # Docker 内网（如需从宿主机/其他容器访问）
        deny all;
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（直播信令服务器使用）
        # 仅在客户端发起 WebSocket 握手时生效，不影响普通 HTTP 请求
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # 文件上传大小限制
        client_max_body_size 200m;

        # 视频/大文件流式传输：关闭缓冲避免 Nginx 缓存整个响应体
        # 否则浏览器 video 元素等待完整文件缓冲才能播放
        proxy_buffering off;
        proxy_request_buffering off;

        # 流式传输超时（大文件预览/下载可能需要更长时间）
        # WebSocket 长连接也需要在此超时时间内发送心跳
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # OpenID 配置发现
    location /.well-known/ {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health-status {
        proxy_pass http://$api_upstream:44354;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
