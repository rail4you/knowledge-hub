<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KnowledgeHub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root>
      <!-- 冷启动品牌闪屏（对齐首页 home-v2 墨青绿 + 暖白视觉语言）。
        Angular 接管并完成首次导航后由 AppComponent 移除，避免弱网下先看到无样式菜单壳。
        纯内联 CSS，无外部依赖，必须在 Angular 样式加载前即可独立渲染。 -->
      <div id="boot-splash">
        <div class="boot-splash-inner">
          <div class="boot-splash-logo">易</div>
          <div class="boot-splash-name">易课通 · 知识资源库</div>
          <div class="boot-splash-bar" role="progressbar" aria-label="正在加载"><i></i></div>
          <div class="boot-splash-tip">正在加载，请稍候…</div>
        </div>
      </div>
      <style>
        #boot-splash {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; align-items: center; justify-content: center;
          background:
            radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f6f8f3 42%, #eef3ec 100%);
          color: #183444;
        }
        /* 顶部品牌渐变细条，呼应首页墨青绿主色 */
        #boot-splash::before {
          content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
          background: linear-gradient(90deg, #087f7a 0%, #4aa79f 55%, #d1ad73 100%);
        }
        #boot-splash .boot-splash-inner {
          display: flex; flex-direction: column; align-items: center;
          text-align: center; animation: boot-rise .45s ease both;
        }
        #boot-splash .boot-splash-logo {
          width: 58px; height: 58px; margin: 0 auto 16px;
          display: flex; align-items: center; justify-content: center;
          font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 1px;
          background: linear-gradient(135deg, #0a8f89, #087f7a);
          border-radius: 16px;
          box-shadow: 0 12px 28px -12px rgba(8, 127, 122, .55);
        }
        #boot-splash .boot-splash-name {
          color: #183444; font-size: 16px; font-weight: 600; letter-spacing: .5px;
        }
        #boot-splash .boot-splash-bar {
          width: 148px; height: 3px; margin: 22px auto 12px;
          border-radius: 999px; background: rgba(8, 127, 122, .14); overflow: hidden;
        }
        #boot-splash .boot-splash-bar i {
          display: block; height: 100%; width: 42%; border-radius: 999px;
          background: linear-gradient(90deg, #087f7a, #4aa79f);
          animation: boot-slide 1.15s cubic-bezier(.4, 0, .2, 1) infinite;
        }
        #boot-splash .boot-splash-tip { color: #697e88; font-size: 12px; letter-spacing: .3px; }
        @keyframes boot-slide { 0% { transform: translateX(-130%); } 100% { transform: translateX(320%); } }
        @keyframes boot-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .boot-splash-inner { animation: none; }
          #boot-splash .boot-splash-bar i { animation: none; width: 100%; }
        }
      </style>
    </app-root>
  </body>
</html>
