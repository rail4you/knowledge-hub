<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="lvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lvBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="lvGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#lvBg)"/>
  <rect width="600" height="360" fill="url(#lvGrid)"/>
  <circle cx="300" cy="180" r="200" fill="url(#lvGlow)"/>

  <!-- 信号波纹（与背景同色系的天空蓝） -->
  <g fill="none" stroke="#7dd3fc" opacity="0.5">
    <circle cx="300" cy="180" r="58" stroke-width="1.5" opacity="0.5"/>
    <circle cx="300" cy="180" r="78" stroke-width="1.2" opacity="0.32" stroke-dasharray="4 6"/>
    <circle cx="300" cy="180" r="98" stroke-width="1" opacity="0.2" stroke-dasharray="2 8"/>
  </g>

  <!-- 播放器卡片（缩小至 150x92，与背景蓝调统一） -->
  <g transform="translate(300 180)">
    <ellipse cx="0" cy="52" rx="70" ry="5" fill="#000000" fill-opacity="0.3"/>
    <rect x="-75" y="-46" width="150" height="92" rx="10" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1.2"/>
    <rect x="-75" y="-46" width="150" height="92" rx="10" fill="url(#lvGlow)" opacity="0.3"/>
    <!-- 顶部小圆点（浏览器窗体感） -->
    <g fill="#7dd3fc" opacity="0.7">
      <circle cx="-62" cy="-36" r="2"/>
      <circle cx="-54" cy="-36" r="2"/>
      <circle cx="-46" cy="-36" r="2"/>
    </g>
    <!-- 播放键 -->
    <circle cx="0" cy="-1" r="21" fill="url(#lvBtn)"/>
    <circle cx="0" cy="-1" r="21" fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity="0.8"/>
    <path d="M -6 -10 L 9 -1 L -6 8 Z" fill="#ffffff"/>
    <!-- 底部进度条（天空蓝） -->
    <rect x="-62" y="29" width="124" height="4" rx="2" fill="#ffffff" opacity="0.22"/>
    <rect x="-62" y="29" width="74" height="4" rx="2" fill="#22d3ee"/>
    <circle cx="12" cy="31" r="4" fill="#22d3ee" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- LIVE 角标 -->
  <g transform="translate(428 84)">
    <rect x="-32" y="-13" width="64" height="26" rx="13" fill="#ef4444"/>
    <circle cx="-18" cy="0" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#ffffff">LIVE</text>
  </g>

  <!-- 弹幕线条点缀（天空蓝） -->
  <g stroke="#7dd3fc" stroke-linecap="round" opacity="0.5">
    <line x1="90" y1="120" x2="150" y2="120" stroke-width="3"/>
    <line x1="110" y1="138" x2="160" y2="138" stroke-width="2"/>
    <line x1="440" y1="236" x2="500" y2="236" stroke-width="3"/>
    <line x1="460" y1="254" x2="505" y2="254" stroke-width="2"/>
  </g>

  <g fill="#ffffff">
    <circle cx="180" cy="240" r="1.2" opacity="0.7"/>
    <circle cx="420" cy="250" r="1" opacity="0.6"/>
    <circle cx="200" cy="90" r="1.1" opacity="0.7"/>
  </g>
</svg>
