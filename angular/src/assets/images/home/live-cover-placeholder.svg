<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="lvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lvBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="lvGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#lvBg)"/>
  <rect width="600" height="360" fill="url(#lvGrid)"/>
  <circle cx="300" cy="180" r="200" fill="url(#lvGlow)"/>

  <!-- 信号波纹 -->
  <g fill="none" stroke="#c4b5fd" opacity="0.5">
    <circle cx="300" cy="180" r="70" stroke-width="1.5" opacity="0.5"/>
    <circle cx="300" cy="180" r="95" stroke-width="1.2" opacity="0.35" stroke-dasharray="4 6"/>
    <circle cx="300" cy="180" r="120" stroke-width="1" opacity="0.22" stroke-dasharray="2 8"/>
  </g>

  <!-- 播放器卡片 -->
  <g transform="translate(300 180)">
    <ellipse cx="0" cy="62" rx="90" ry="6" fill="#2e1065" fill-opacity="0.5"/>
    <rect x="-95" y="-55" width="190" height="114" rx="12" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="-95" y="-55" width="190" height="114" rx="12" fill="url(#lvGlow)" opacity="0.35"/>
    <!-- 播放键 -->
    <circle cx="0" cy="4" r="26" fill="url(#lvBtn)"/>
    <circle cx="0" cy="4" r="26" fill="none" stroke="#ede9fe" stroke-width="1.5" opacity="0.7"/>
    <path d="M -7 -8 L 11 4 L -7 16 Z" fill="#ffffff"/>
    <!-- 底部进度条 -->
    <rect x="-80" y="38" width="160" height="5" rx="2.5" fill="#ffffff" opacity="0.2"/>
    <rect x="-80" y="38" width="95" height="5" rx="2.5" fill="#f472b6"/>
    <circle cx="15" cy="40.5" r="5" fill="#f472b6" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- LIVE 角标 -->
  <g transform="translate(420 92)">
    <rect x="-30" y="-13" width="60" height="26" rx="13" fill="#ef4444"/>
    <circle cx="-16" cy="0" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-16" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 弹幕线条点缀 -->
  <g stroke="#c4b5fd" stroke-linecap="round" opacity="0.55">
    <line x1="90" y1="120" x2="150" y2="120" stroke-width="3"/>
    <line x1="110" y1="138" x2="160" y2="138" stroke-width="2"/>
    <line x1="440" y1="230" x2="500" y2="230" stroke-width="3"/>
    <line x1="460" y1="248" x2="505" y2="248" stroke-width="2"/>
  </g>

  <g fill="#ffffff">
    <circle cx="180" cy="240" r="1.2" opacity="0.7"/>
    <circle cx="420" cy="250" r="1" opacity="0.6"/>
    <circle cx="200" cy="90" r="1.1" opacity="0.7"/>
  </g>
</svg>
