<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- 浅蓝底衬 -->
  <ellipse cx="160" cy="112" rx="128" ry="76" fill="#e0f2fe" opacity="0.55"/>
  <ellipse cx="160" cy="112" rx="96" ry="56" fill="#bae6fd" opacity="0.3"/>

  <!-- 简历纸 -->
  <g transform="translate(150 108)">
    <ellipse cx="0" cy="62" rx="58" ry="5" fill="#0284c7" opacity="0.12"/>
    <rect x="-45" y="-62" width="90" height="122" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="25,-62 45,-42 45,-62" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- 照片框 -->
    <rect x="-35" y="-48" width="28" height="34" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="-21" cy="-36" r="6" fill="#7dd3fc"/>
    <path d="M -31 -20 a 10 7 0 0 1 20 0" fill="#7dd3fc" opacity="0.7"/>
    <!-- 右侧行 -->
    <g stroke="#38bdf8" stroke-linecap="round">
      <line x1="0" y1="-42" x2="34" y2="-42" stroke-width="2.5" opacity="0.8"/>
      <line x1="0" y1="-33" x2="34" y2="-33" stroke-width="2" opacity="0.5"/>
      <line x1="0" y1="-24" x2="24" y2="-24" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- 下方行 -->
    <g stroke="#0284c7" stroke-linecap="round">
      <line x1="-35" y1="-4" x2="35" y2="-4" stroke-width="2" opacity="0.45"/>
      <line x1="-35" y1="6" x2="35" y2="6" stroke-width="2" opacity="0.3"/>
      <line x1="-35" y1="16" x2="28" y2="16" stroke-width="2" opacity="0.3"/>
      <line x1="-35" y1="26" x2="32" y2="26" stroke-width="2" opacity="0.2"/>
      <line x1="-35" y1="36" x2="20" y2="36" stroke-width="2" opacity="0.2"/>
    </g>
  </g>

  <!-- 铅笔 -->
  <g transform="translate(224 62) rotate(32)">
    <rect x="-6" y="-32" width="12" height="44" rx="3" fill="#38bdf8"/>
    <rect x="-6" y="-32" width="12" height="8" rx="3" fill="#f59e0b"/>
    <polygon points="-6,12 6,12 0,26" fill="#0c4a6e"/>
    <circle cx="0" cy="17" r="1.6" fill="#e0f2fe"/>
  </g>

  <!-- 点缀 -->
  <g stroke="#7dd3fc" stroke-linecap="round">
    <line x1="36" y1="132" x2="62" y2="132" stroke-width="3" opacity="0.6"/>
    <line x1="46" y1="144" x2="66" y2="144" stroke-width="2" opacity="0.4"/>
    <line x1="258" y1="140" x2="284" y2="140" stroke-width="3" opacity="0.6"/>
    <line x1="254" y1="152" x2="274" y2="152" stroke-width="2" opacity="0.4"/>
  </g>
  <g fill="#0284c7">
    <circle cx="56" cy="60" r="2.5" opacity="0.5"/>
    <circle cx="70" cy="164" r="2" opacity="0.4"/>
    <circle cx="262" cy="160" r="2" opacity="0.4"/>
    <path d="M 88 44 l 0 8 M 84 48 l 8 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 244 36 l 0 8 M 240 40 l 8 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
