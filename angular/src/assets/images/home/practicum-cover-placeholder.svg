<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 全站占位图固定底（与资讯占位图一致）：天空蓝渐变 -->
    <linearGradient id="pxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="pxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pxLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="pxGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#pxBg)"/>
  <rect width="600" height="360" fill="url(#pxGrid)"/>
  <circle cx="300" cy="180" r="200" fill="url(#pxGlow)"/>
  <circle cx="300" cy="180" r="130" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 6"/>

  <circle cx="150" cy="90" r="2.5" fill="#e0f2fe" opacity="0.75"/>
  <circle cx="450" cy="90" r="2" fill="#bae6fd" opacity="0.85"/>
  <circle cx="130" cy="270" r="1.5" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="470" cy="270" r="2.5" fill="#bae6fd" opacity="0.7"/>

  <!-- 实验烧瓶 -->
  <g transform="translate(270 180)">
    <ellipse cx="0" cy="72" rx="62" ry="6" fill="#082f49" fill-opacity="0.45"/>
    <rect x="-14" y="-70" width="28" height="44" fill="#e0f2fe" fill-opacity="0.22" stroke="#bae6fd" stroke-width="1.5"/>
    <path d="M -14 -26 L -52 52 Q -55 62 -45 62 L 45 62 Q 55 62 52 52 L 14 -26 Z"
          fill="#e0f2fe" fill-opacity="0.16" stroke="#bae6fd" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -32 18 L -46 52 Q -48 58 -41 58 L 41 58 Q 48 58 46 52 L 32 18 Q 30 14 24 14 L -24 14 Q -30 14 -32 18 Z"
          fill="url(#pxLiquid)" opacity="0.92"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#f0f9ff" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
    <circle cx="-12" cy="40" r="4" fill="#f0f9ff" opacity="0.85"/>
    <circle cx="8" cy="48" r="3" fill="#f0f9ff" opacity="0.75"/>
    <circle cx="16" cy="32" r="2.2" fill="#f0f9ff" opacity="0.85"/>
    <circle cx="-2" cy="26" r="1.6" fill="#f0f9ff" opacity="0.75"/>
    <path d="M -44 40 L -30 4" stroke="#ffffff" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- 齿轮点缀 -->
  <g transform="translate(400 110)" opacity="0.8">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#bae6fd" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#bae6fd" opacity="0.7"/>
    <g stroke="#bae6fd" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-16"/>
      <line x1="0" y1="16" x2="0" y2="24"/>
      <line x1="-24" y1="0" x2="-16" y2="0"/>
      <line x1="16" y1="0" x2="24" y2="0"/>
      <line x1="-17" y1="-17" x2="-11" y2="-11"/>
      <line x1="17" y1="-17" x2="11" y2="-11"/>
      <line x1="-17" y1="17" x2="-11" y2="11"/>
      <line x1="17" y1="17" x2="11" y2="11"/>
    </g>
  </g>

  <!-- 试管点缀 -->
  <g transform="translate(180 240) rotate(18)" opacity="0.85">
    <rect x="-8" y="-30" width="16" height="52" rx="8" fill="#e0f2fe" fill-opacity="0.2" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="-8" y="-8" width="16" height="30" rx="8" fill="url(#pxLiquid)" opacity="0.85"/>
  </g>

  <g fill="#ffffff">
    <circle cx="220" cy="80" r="1.2" opacity="0.75"/>
    <circle cx="380" cy="250" r="1.2" opacity="0.7"/>
    <circle cx="480" cy="180" r="1" opacity="0.6"/>
  </g>
</svg>
