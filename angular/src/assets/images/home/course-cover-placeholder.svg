<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 主背景：深空蓝渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1e3e"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- 中心光晕 -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1e40af" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
    <!-- 书脊渐变 -->
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- 页面渐变 -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- 光柱 -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <!-- 网格 -->
    <pattern id="gridPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="360" fill="url(#bgGrad)"/>
  <rect width="600" height="360" fill="url(#gridPattern)"/>

  <!-- 中心光晕 -->
  <circle cx="300" cy="180" r="220" fill="url(#centerGlow)"/>

  <!-- 装饰光柱（左下） -->
  <polygon points="0,360 180,360 60,160" fill="url(#beamGrad)" opacity="0.55"/>
  <polygon points="450,360 600,360 540,160" fill="url(#beamGrad)" opacity="0.5"/>

  <!-- 顶部光束 -->
  <polygon points="280,0 320,0 310,180 290,180" fill="#60a5fa" fill-opacity="0.12"/>

  <!-- 虚线圆环 -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="300" cy="180" r="180" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- 数据点（仪表盘风格） -->
  <g fill="#60a5fa">
    <circle cx="160" cy="80" r="2.5" opacity="0.8"/>
    <circle cx="170" cy="105" r="1.5" opacity="0.6"/>
    <circle cx="155" cy="130" r="2" opacity="0.7"/>
    <circle cx="180" cy="155" r="1.2" opacity="0.5"/>
    <circle cx="450" cy="80" r="2" opacity="0.7"/>
    <circle cx="430" cy="105" r="2.5" opacity="0.85"/>
    <circle cx="445" cy="130" r="1.5" opacity="0.6"/>
    <circle cx="425" cy="155" r="1.8" opacity="0.7"/>
  </g>

  <!-- 装饰折线（数据波形） -->
  <path d="M 60 230 L 100 220 L 120 240 L 160 210 L 200 235" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 400 235 L 440 215 L 480 240 L 520 220 L 540 235" fill="none" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中心书本图标 -->
  <g transform="translate(300 180)">
    <!-- 书阴影 -->
    <ellipse cx="0" cy="50" rx="60" ry="6" fill="#000000" fill-opacity="0.3"/>
    <!-- 左页 -->
    <path d="M -55 -42 L -50 -42 L -2 -34 L -2 38 L -50 30 L -55 30 Z" fill="url(#pageGrad)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- 右页 -->
    <path d="M 55 -42 L 50 -42 L 2 -34 L 2 38 L 50 30 L 55 30 Z" fill="url(#pageGrad)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- 书脊 -->
    <path d="M -2 -34 L 2 -34 L 2 38 L -2 38 Z" fill="#1e40af"/>
    <!-- 页面线条 -->
    <line x1="-44" y1="-22" x2="-12" y2="-18" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="-44" y1="-8" x2="-12" y2="-4" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="-44" y1="6" x2="-12" y2="10" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="-44" y1="20" x2="-12" y2="22" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="12" y1="-18" x2="44" y2="-22" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="12" y1="-4" x2="44" y2="-8" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="12" y1="10" x2="44" y2="6" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <line x1="12" y1="22" x2="44" y2="20" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <!-- 书页高光 -->
    <path d="M -50 -38 L -45 -42 L -3 -36 L -2 -32 L -45 -38 Z" fill="#ffffff" fill-opacity="0.4"/>
    <path d="M 50 -38 L 45 -42 L 3 -36 L 2 -32 L 45 -38 Z" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- 装饰小图标：六边形（围绕书本） -->
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.2">
    <polygon points="120,150 132,143 144,150 144,164 132,171 120,164"/>
    <polygon points="480,150 492,143 504,150 504,164 492,171 480,164"/>
    <polygon points="100,220 110,214 120,220 120,232 110,238 100,232"/>
    <polygon points="500,220 510,214 520,220 520,232 510,238 500,232"/>
  </g>

  <!-- 闪光点 -->
  <g fill="#ffffff">
    <circle cx="220" cy="80" r="1.2" opacity="0.75"/>
    <circle cx="380" cy="100" r="1.5" opacity="0.85"/>
    <circle cx="120" cy="280" r="1" opacity="0.55"/>
    <circle cx="480" cy="290" r="1.2" opacity="0.7"/>
    <circle cx="200" cy="310" r="0.9" opacity="0.5"/>
    <circle cx="400" cy="60" r="1.1" opacity="0.65"/>
  </g>

  <!-- HUD 装饰：左上 -->
  <g transform="translate(40 40)" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1">
    <rect x="0" y="0" width="40" height="20"/>
    <line x1="0" y1="6" x2="40" y2="6"/>
    <line x1="0" y1="14" x2="40" y2="14"/>
  </g>
  <!-- HUD 装饰：右下 -->
  <g transform="translate(520 300)" fill="none" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1">
    <rect x="0" y="0" width="40" height="20"/>
    <line x1="0" y1="6" x2="40" y2="6"/>
    <line x1="0" y1="14" x2="40" y2="14"/>
  </g>
</svg>