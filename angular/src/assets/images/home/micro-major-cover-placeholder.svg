<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 主背景：教育主题 - 深蓝到紫色渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <!-- 书本背景 -->
    <linearGradient id="bookBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <!-- 页面 -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <!-- 书本页（更亮） -->
    <linearGradient id="pageBright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- 学士帽 -->
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- 光晕（书本发光） -->
    <radialGradient id="bookGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <!-- 网格图案 -->
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <!-- 装饰光柱 -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#gridPattern)"/>

  <!-- 装饰光柱（左下→右上） -->
  <polygon points="60,400 180,400 80,200" fill="url(#beamGrad)" opacity="0.5"/>
  <polygon points="280,400 340,400 320,200" fill="url(#beamGrad)" opacity="0.4"/>

  <!-- 数据点装饰 -->
  <circle cx="60" cy="80" r="2.5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="340" cy="60" r="3" fill="#22d3ee" opacity="0.8"/>
  <circle cx="350" cy="120" r="2" fill="#60a5fa" opacity="0.6"/>
  <circle cx="80" cy="160" r="2" fill="#22d3ee" opacity="0.7"/>
  <circle cx="40" cy="220" r="1.5" fill="#60a5fa" opacity="0.5"/>
  <circle cx="370" cy="180" r="1.8" fill="#22d3ee" opacity="0.6"/>

  <!-- 装饰线条（科技感） -->
  <path d="M 30 280 L 80 280 L 90 270 L 140 270" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
  <path d="M 320 280 L 370 280 L 380 290" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>

  <!-- 中心光晕 -->
  <circle cx="200" cy="200" r="160" fill="url(#bookGlow)"/>

  <!-- 书本堆叠（教育主题） -->
  <g transform="translate(200 220)">
    <!-- 底部书本（红褐色） -->
    <g transform="translate(-90 35) rotate(-3)">
      <rect x="-50" y="-12" width="100" height="22" rx="3" fill="#b45309"/>
      <rect x="-50" y="-12" width="100" height="22" rx="3" fill="url(#pageBright)" fill-opacity="0.15"/>
      <rect x="-50" y="-14" width="100" height="3" fill="#92400e"/>
      <rect x="-50" y="11" width="100" height="3" fill="#78350f"/>
      <text x="0" y="3" text-anchor="middle" font-size="9" fill="#fef3c7" font-weight="700" font-family="serif">TEXTBOOK</text>
    </g>

    <!-- 中部书本（绿色） -->
    <g transform="translate(-50 -20) rotate(2)">
      <rect x="-50" y="-12" width="100" height="22" rx="3" fill="#16a34a"/>
      <rect x="-50" y="-12" width="100" height="22" rx="3" fill="url(#pageBright)" fill-opacity="0.15"/>
      <rect x="-50" y="-14" width="100" height="3" fill="#15803d"/>
      <rect x="-50" y="11" width="100" height="3" fill="#14532d"/>
      <text x="0" y="3" text-anchor="middle" font-size="9" fill="#dcfce7" font-weight="700" font-family="serif">SCIENCE</text>
    </g>

    <!-- 顶部书本（打开的精装书） -->
    <g transform="translate(40 -65)">
      <!-- 书阴影 -->
      <ellipse cx="0" cy="40" rx="80" ry="6" fill="#000000" fill-opacity="0.3"/>

      <!-- 左页 -->
      <path d="M -70 -32 L -65 -32 L -2 -28 L -2 38 L -65 32 L -70 32 Z"
            fill="url(#pageBright)" stroke="#94a3b8" stroke-width="0.8"/>
      <!-- 右页 -->
      <path d="M 70 -32 L 65 -32 L 2 -28 L 2 38 L 65 32 L 70 32 Z"
            fill="url(#pageBright)" stroke="#94a3b8" stroke-width="0.8"/>

      <!-- 左页文字线 -->
      <line x1="-58" y1="-18" x2="-12" y2="-14" stroke="#475569" stroke-width="1.4" opacity="0.7"/>
      <line x1="-58" y1="-8" x2="-15" y2="-5" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
      <line x1="-58" y1="2" x2="-12" y2="5" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
      <line x1="-58" y1="12" x2="-18" y2="14" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
      <line x1="-58" y1="22" x2="-12" y2="24" stroke="#475569" stroke-width="1.2" opacity="0.6"/>

      <!-- 右页文字线 -->
      <line x1="12" y1="-14" x2="58" y2="-18" stroke="#475569" stroke-width="1.4" opacity="0.7"/>
      <line x1="15" y1="-5" x2="58" y2="-8" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
      <line x1="12" y1="5" x2="58" y2="2" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
      <line x1="18" y1="14" x2="58" y2="12" stroke="#475569" stroke-width="1.2" opacity="0.6"/>
      <line x1="12" y1="24" x2="58" y2="22" stroke="#475569" stroke-width="1.2" opacity="0.6"/>

      <!-- 中央图形（教育图标 - 大写"A"代表学术） -->
      <g transform="translate(0 -2)">
        <circle cx="0" cy="0" r="13" fill="#1e40af"/>
        <text x="0" y="5" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="900" font-family="serif">A</text>
      </g>

      <!-- 书页高光 -->
      <path d="M -65 -28 L -60 -32 L -3 -30 L -2 -26 L -60 -28 Z" fill="#ffffff" fill-opacity="0.55"/>
      <path d="M 65 -28 L 60 -32 L 3 -30 L 2 -26 L 60 -28 Z" fill="#ffffff" fill-opacity="0.55"/>

      <!-- 书脊阴影 -->
      <path d="M -2 -28 L 2 -28 L 2 38 L -2 38 Z" fill="#1e40af"/>
    </g>

    <!-- 学士帽（教育象征） -->
    <g transform="translate(75 -70)">
      <!-- 帽顶（方形） -->
      <polygon points="-30,-2 0,-12 30,-2 0,8" fill="url(#capGrad)" stroke="#0f172a" stroke-width="1"/>
      <!-- 帽顶平面 -->
      <polygon points="-30,-2 -30,4 0,14 30,4 30,-2 0,-12" fill="url(#capGrad)" stroke="#0f172a" stroke-width="1" opacity="0.92"/>
      <polygon points="-30,-2 0,-12 30,-2 0,8" fill="#475569" stroke="#0f172a" stroke-width="1"/>
      <!-- 帽中央纽扣 -->
      <circle cx="0" cy="-2" r="3" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>
      <circle cx="0" cy="-2" r="1.2" fill="#fef3c7"/>

      <!-- 流苏 -->
      <path d="M 0 -2 Q 8 6 12 16" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
      <circle cx="13" cy="18" r="3.5" fill="#f59e0b"/>
      <g stroke="#f59e0b" stroke-width="0.6">
        <line x1="13" y1="20" x2="11" y2="27"/>
        <line x1="13" y1="20" x2="14" y2="28"/>
        <line x1="13" y1="20" x2="16" y2="27"/>
        <line x1="13" y1="20" x2="10" y2="25"/>
        <line x1="13" y1="20" x2="17" y2="25"/>
      </g>
    </g>

    <!-- 装饰：飘动的纸页（左上） -->
    <g transform="translate(-110 -100) rotate(-15)">
      <rect x="-10" y="-13" width="20" height="26" rx="2" fill="#ffffff" fill-opacity="0.85"/>
      <line x1="-7" y1="-7" x2="7" y2="-7" stroke="#475569" stroke-width="0.8"/>
      <line x1="-7" y1="-2" x2="7" y2="-2" stroke="#475569" stroke-width="0.8"/>
      <line x1="-7" y1="3" x2="7" y2="3" stroke="#475569" stroke-width="0.8"/>
      <line x1="-7" y1="8" x2="5" y2="8" stroke="#475569" stroke-width="0.8"/>
    </g>

    <!-- 装饰：飘动的纸页（右下） -->
    <g transform="translate(120 80) rotate(20)">
      <rect x="-10" y="-13" width="20" height="26" rx="2" fill="#ffffff" fill-opacity="0.85"/>
      <line x1="-7" y1="-7" x2="7" y2="-7" stroke="#475569" stroke-width="0.8"/>
      <line x1="-7" y1="-2" x2="7" y2="-2" stroke="#475569" stroke-width="0.8"/>
      <line x1="-7" y1="3" x2="7" y2="3" stroke="#475569" stroke-width="0.8"/>
      <line x1="-7" y1="8" x2="5" y2="8" stroke="#475569" stroke-width="0.8"/>
    </g>

    <!-- 铅笔装饰（左下） -->
    <g transform="translate(-110 100) rotate(-30)">
      <rect x="-25" y="-2" width="40" height="6" fill="#fbbf24"/>
      <polygon points="15,-2 22,-2 25,1 22,4 15,4" fill="#1e293b"/>
      <polygon points="22,-1 24,1 22,3" fill="#94a3b8"/>
      <rect x="-30" y="-2" width="6" height="6" fill="#ef4444"/>
      <rect x="-28" y="-1" width="2" height="4" fill="#dc2626"/>
    </g>
  </g>

  <!-- 闪光点 -->
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="1.2" opacity="0.8"/>
    <circle cx="290" cy="100" r="1.5" opacity="0.85"/>
    <circle cx="105" cy="280" r="1.2" opacity="0.7"/>
    <circle cx="310" cy="280" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="60" r="0.9" opacity="0.55"/>
    <circle cx="230" cy="350" r="1" opacity="0.6"/>
  </g>
</svg>