<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 主背景：天空蓝 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <!-- 报纸底色 -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- 光晕 -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <!-- 网格 -->
    <pattern id="gridPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#bae6fd" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="360" fill="url(#bgGrad)"/>
  <rect width="600" height="360" fill="url(#gridPattern)"/>

  <!-- 中心光晕 -->
  <circle cx="300" cy="180" r="200" fill="url(#centerGlow)"/>

  <!-- 虚线圆环 -->
  <circle cx="300" cy="180" r="130" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- 数据点 -->
  <circle cx="150" cy="90" r="2.5" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="450" cy="90" r="2" fill="#bae6fd" opacity="0.8"/>
  <circle cx="130" cy="270" r="1.5" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="470" cy="270" r="2.5" fill="#bae6fd" opacity="0.7"/>

  <!-- 报纸 -->
  <g transform="translate(300 182)">
    <!-- 阴影 -->
    <ellipse cx="0" cy="86" rx="110" ry="6" fill="#082f49" fill-opacity="0.4"/>

    <!-- 主页面 -->
    <rect x="-100" y="-80" width="200" height="160" rx="6" fill="url(#paperGrad)" stroke="#075985" stroke-width="1"/>

    <!-- 头条色块 -->
    <rect x="-88" y="-68" width="176" height="20" rx="3" fill="#0c4a6e"/>
    <rect x="-88" y="-68" width="52" height="20" rx="3" fill="#f59e0b"/>

    <!-- 大标题占位条 -->
    <rect x="-88" y="-38" width="110" height="7" rx="2" fill="#0c4a6e"/>
    <rect x="-88" y="-27" width="76" height="5" rx="2" fill="#0c4a6e" opacity="0.55"/>

    <!-- 左栏文本线 -->
    <line x1="-88" y1="-12" x2="-28" y2="-12" stroke="#64748b" stroke-width="1.4" opacity="0.7"/>
    <line x1="-88" y1="-4" x2="-32" y2="-4" stroke="#64748b" stroke-width="1.2" opacity="0.55"/>
    <line x1="-88" y1="4" x2="-28" y2="4" stroke="#64748b" stroke-width="1.2" opacity="0.55"/>
    <line x1="-88" y1="12" x2="-36" y2="12" stroke="#64748b" stroke-width="1.2" opacity="0.55"/>
    <line x1="-88" y1="20" x2="-28" y2="20" stroke="#64748b" stroke-width="1.2" opacity="0.55"/>
    <line x1="-88" y1="28" x2="-46" y2="28" stroke="#64748b" stroke-width="1.2" opacity="0.55"/>

    <!-- 右栏配图块 -->
    <rect x="-14" y="-12" width="102" height="48" rx="3" fill="#0369a1"/>
    <g transform="translate(37 12)">
      <circle cx="0" cy="-6" r="5" fill="#e0f2fe"/>
      <path d="M -8 6 Q -8 -2 0 -2 Q 8 -2 8 6 L 8 12 L -8 12 Z" fill="#e0f2fe"/>
    </g>

    <!-- 底部分隔线 -->
    <line x1="-88" y1="48" x2="88" y2="48" stroke="#075985" stroke-width="1" opacity="0.35"/>
    <line x1="-88" y1="60" x2="-40" y2="60" stroke="#075985" stroke-width="1.2" opacity="0.45"/>
    <line x1="-28" y1="60" x2="30" y2="60" stroke="#075985" stroke-width="1.2" opacity="0.45"/>
    <line x1="42" y1="60" x2="88" y2="60" stroke="#075985" stroke-width="1.2" opacity="0.45"/>

    <!-- 铃铛点缀 -->
    <g transform="translate(78 -96)">
      <circle cx="0" cy="0" r="15" fill="#fbbf24" opacity="0.95"/>
      <path d="M -6 -4 Q -6 -10 0 -10 Q 6 -10 6 -4 L 6 2 L 7 5 L -7 5 L -6 2 Z" fill="#0c4a6e"/>
      <circle cx="0" cy="7" r="2" fill="#0c4a6e"/>
    </g>
  </g>

  <!-- 闪光点 -->
  <g fill="#ffffff">
    <circle cx="220" cy="80" r="1.2" opacity="0.75"/>
    <circle cx="380" cy="100" r="1.5" opacity="0.85"/>
    <circle cx="200" cy="290" r="1" opacity="0.55"/>
    <circle cx="400" cy="290" r="1.2" opacity="0.7"/>
  </g>
</svg>
