<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="lePlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="leWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- 浅蓝底衬（透明底画布上的柔光，与白卡搭配） -->
  <ellipse cx="160" cy="112" rx="128" ry="76" fill="#e0f2fe" opacity="0.55"/>
  <ellipse cx="160" cy="112" rx="96" ry="56" fill="#bae6fd" opacity="0.3"/>

  <!-- 信号弧线 -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <path d="M 84 96 a 44 44 0 0 1 12 -28" stroke-width="3" opacity="0.55"/>
    <path d="M 72 104 a 62 62 0 0 1 16 -40" stroke-width="2.5" opacity="0.3"/>
    <path d="M 236 96 a 44 44 0 0 0 -12 -28" stroke-width="3" opacity="0.55"/>
    <path d="M 248 104 a 62 62 0 0 0 -16 -40" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- 播放器窗口 -->
  <g>
    <ellipse cx="160" cy="168" rx="62" ry="5" fill="#0284c7" opacity="0.12"/>
    <rect x="95" y="62" width="130" height="100" rx="12" fill="url(#leWin)" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="95" y1="84" x2="225" y2="84" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
    <g fill="#38bdf8" opacity="0.8">
      <circle cx="108" cy="73" r="3"/>
      <circle cx="119" cy="73" r="3"/>
      <circle cx="130" cy="73" r="3"/>
    </g>
    <!-- 播放键 -->
    <circle cx="160" cy="124" r="19" fill="url(#lePlay)"/>
    <circle cx="160" cy="124" r="19" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.9"/>
    <path d="M 154 116 L 168 124 L 154 132 Z" fill="#ffffff"/>
    <!-- 进度条 -->
    <rect x="112" y="148" width="96" height="4" rx="2" fill="#0284c7" opacity="0.15"/>
    <rect x="112" y="148" width="56" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="168" cy="150" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- LIVE 小徽标 -->
  <g transform="translate(222 66)">
    <rect x="-26" y="-11" width="52" height="22" rx="11" fill="#ef4444"/>
    <circle cx="-14" cy="0" r="4" fill="#ffffff"/>
    <text x="9" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">LIVE</text>
  </g>

  <!-- 点缀 -->
  <g stroke="#7dd3fc" stroke-linecap="round">
    <line x1="36" y1="132" x2="62" y2="132" stroke-width="3" opacity="0.6"/>
    <line x1="46" y1="144" x2="66" y2="144" stroke-width="2" opacity="0.4"/>
    <line x1="258" y1="132" x2="284" y2="132" stroke-width="3" opacity="0.6"/>
    <line x1="254" y1="144" x2="274" y2="144" stroke-width="2" opacity="0.4"/>
  </g>
  <g fill="#0284c7">
    <circle cx="52" cy="70" r="2.5" opacity="0.5"/>
    <circle cx="272" cy="66" r="2.5" opacity="0.5"/>
    <circle cx="262" cy="164" r="2" opacity="0.4"/>
    <circle cx="58" cy="160" r="2" opacity="0.4"/>
    <path d="M 90 52 l 0 8 M 86 56 l 8 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 232 44 l 0 8 M 228 48 l 8 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
