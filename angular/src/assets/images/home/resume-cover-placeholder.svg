<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="rsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rsBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rsGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#rsBg)"/>
  <rect width="600" height="360" fill="url(#rsGrid)"/>
  <circle cx="300" cy="180" r="220" fill="url(#rsGlow)"/>

  <!-- 光柱 -->
  <polygon points="0,360 180,360 60,160" fill="url(#rsBeam)" opacity="0.55"/>
  <polygon points="450,360 600,360 540,160" fill="url(#rsBeam)" opacity="0.5"/>
  <polygon points="280,0 320,0 310,180 290,180" fill="#60a5fa" fill-opacity="0.12"/>

  <!-- 虚线圆环 -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="300" cy="180" r="180" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- 数据波形 -->
  <path d="M 60 230 L 100 220 L 120 240 L 160 210 L 200 235" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 400 235 L 440 215 L 480 240 L 520 220 L 540 235" fill="none" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 数据点 -->
  <g fill="#60a5fa">
    <circle cx="160" cy="80" r="2.5" opacity="0.8"/>
    <circle cx="170" cy="105" r="1.5" opacity="0.6"/>
    <circle cx="155" cy="130" r="2" opacity="0.7"/>
    <circle cx="450" cy="80" r="2" opacity="0.7"/>
    <circle cx="430" cy="105" r="2.5" opacity="0.85"/>
    <circle cx="445" cy="130" r="1.5" opacity="0.6"/>
  </g>

  <!-- 简历纸 + 铅笔 -->
  <g transform="translate(292 182)">
    <ellipse cx="0" cy="102" rx="82" ry="6" fill="#000000" fill-opacity="0.3"/>
    <!-- 纸张 -->
    <rect x="-70" y="-98" width="140" height="196" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="42,-98 70,-70 70,-98" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- 照片框 -->
    <rect x="-56" y="-80" width="44" height="54" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="-34" cy="-60" r="9" fill="#7dd3fc"/>
    <path d="M -48 -34 a 14 10 0 0 1 28 0" fill="#7dd3fc" opacity="0.7"/>
    <!-- 右侧标题行 -->
    <g stroke="#0284c7" stroke-linecap="round">
      <line x1="0" y1="-70" x2="52" y2="-70" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="-58" x2="52" y2="-58" stroke-width="2.5" opacity="0.45"/>
      <line x1="0" y1="-46" x2="36" y2="-46" stroke-width="2.5" opacity="0.45"/>
    </g>
    <!-- 正文行 -->
    <g stroke="#0284c7" stroke-linecap="round">
      <line x1="-56" y1="-12" x2="56" y2="-12" stroke-width="2.5" opacity="0.4"/>
      <line x1="-56" y1="0" x2="56" y2="0" stroke-width="2.5" opacity="0.3"/>
      <line x1="-56" y1="12" x2="44" y2="12" stroke-width="2.5" opacity="0.3"/>
      <line x1="-56" y1="24" x2="50" y2="24" stroke-width="2.5" opacity="0.2"/>
    </g>
    <!-- 技能小标签 -->
    <g>
      <rect x="-56" y="40" width="62" height="20" rx="10" fill="#38bdf8" opacity="0.9"/>
      <circle cx="-46" cy="50" r="3" fill="#ffffff"/>
      <line x1="-38" y1="50" x2="-4" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-56" y="66" width="48" height="20" rx="10" fill="#0ea5e9" opacity="0.75"/>
      <circle cx="-46" cy="76" r="3" fill="#ffffff"/>
      <line x1="-38" y1="76" x2="-18" y2="76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- 铅笔 -->
    <g transform="translate(96 30) rotate(28)">
      <rect x="-8" y="-52" width="16" height="72" rx="4" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
      <rect x="-8" y="-52" width="16" height="12" rx="4" fill="#f59e0b"/>
      <polygon points="-8,20 8,20 0,38" fill="#0c4a6e"/>
      <circle cx="0" cy="26" r="2.2" fill="#e0f2fe"/>
    </g>
    <!-- 完成徽章 -->
    <circle cx="-84" cy="78" r="17" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M -92 78 l 6 6 l 11 -12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 六边形点缀 -->
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.2">
    <polygon points="120,150 132,143 144,150 144,164 132,171 120,164"/>
    <polygon points="480,150 492,143 504,150 504,164 492,171 480,164"/>
    <polygon points="100,220 110,214 120,220 120,232 110,238 100,232"/>
    <polygon points="500,220 510,214 520,220 520,232 510,238 500,232"/>
  </g>

  <!-- 闪光点 -->
  <g fill="#ffffff">
    <circle cx="220" cy="80" r="1.2" opacity="0.75"/>
    <circle cx="380" cy="100" r="1.5" opacity="0.85"/>
    <circle cx="120" cy="280" r="1" opacity="0.55"/>
    <circle cx="480" cy="290" r="1.2" opacity="0.7"/>
  </g>

  <!-- HUD 装饰 -->
  <g transform="translate(40 40)" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1">
    <rect x="0" y="0" width="40" height="20"/>
    <line x1="0" y1="6" x2="40" y2="6"/>
    <line x1="0" y1="14" x2="40" y2="14"/>
  </g>
  <g transform="translate(520 300)" fill="none" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1">
    <rect x="0" y="0" width="40" height="20"/>
    <line x1="0" y1="6" x2="40" y2="6"/>
    <line x1="0" y1="14" x2="40" y2="14"/>
  </g>
</svg>
