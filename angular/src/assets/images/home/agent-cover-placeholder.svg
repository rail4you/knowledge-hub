<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="agBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="agGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="agHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="agGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#agBg)"/>
  <rect width="600" height="360" fill="url(#agGrid)"/>
  <circle cx="300" cy="180" r="200" fill="url(#agGlow)"/>
  <circle cx="300" cy="180" r="130" fill="none" stroke="#7dd3fc" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- 电路节点 -->
  <g fill="#7dd3fc">
    <circle cx="150" cy="110" r="3" opacity="0.8"/>
    <circle cx="450" cy="110" r="3" opacity="0.8"/>
    <circle cx="150" cy="250" r="3" opacity="0.7"/>
    <circle cx="450" cy="250" r="3" opacity="0.7"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="1" opacity="0.4">
    <path d="M 150 110 L 210 110 L 230 130" fill="none"/>
    <path d="M 450 110 L 390 110 L 370 130" fill="none"/>
    <path d="M 150 250 L 210 250 L 230 230" fill="none"/>
    <path d="M 450 250 L 390 250 L 370 230" fill="none"/>
  </g>

  <!-- 机器人头 -->
  <g transform="translate(300 178)">
    <ellipse cx="0" cy="72" rx="58" ry="6" fill="#020617" fill-opacity="0.5"/>
    <!-- 天线 -->
    <line x1="0" y1="-58" x2="0" y2="-74" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-78" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="-78" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <!-- 头部 -->
    <rect x="-48" y="-58" width="96" height="70" rx="18" fill="url(#agHead)"/>
    <rect x="-48" y="-58" width="96" height="70" rx="18" fill="none" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6"/>
    <!-- 面板 -->
    <rect x="-36" y="-46" width="72" height="46" rx="10" fill="#0f172a"/>
    <!-- 眼睛 -->
    <circle cx="-16" cy="-27" r="6" fill="#38bdf8"/>
    <circle cx="-16" cy="-27" r="6" fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.8"/>
    <circle cx="-14.5" cy="-28.5" r="1.8" fill="#ffffff"/>
    <circle cx="16" cy="-27" r="6" fill="#38bdf8"/>
    <circle cx="16" cy="-27" r="6" fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.8"/>
    <circle cx="17.5" cy="-28.5" r="1.8" fill="#ffffff"/>
    <!-- 嘴（声波） -->
    <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
      <line x1="-8" y1="-10" x2="-8" y2="-6"/>
      <line x1="-3" y1="-12" x2="-3" y2="-4"/>
      <line x1="2" y1="-12" x2="2" y2="-4"/>
      <line x1="7" y1="-10" x2="7" y2="-6"/>
    </g>
    <!-- 耳朵 -->
    <rect x="-56" y="-40" width="8" height="22" rx="4" fill="#64748b"/>
    <rect x="48" y="-40" width="8" height="22" rx="4" fill="#64748b"/>
    <!-- 身体 -->
    <path d="M -34 12 L 34 12 L 26 66 L -26 66 Z" fill="url(#agHead)" opacity="0.92"/>
    <circle cx="0" cy="30" r="6" fill="#0f172a"/>
    <circle cx="0" cy="30" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- 对话气泡点缀 -->
  <g transform="translate(445 230)" opacity="0.9">
    <rect x="-28" y="-18" width="56" height="30" rx="9" fill="#e2e8f0" fill-opacity="0.9"/>
    <path d="M -12 12 L -16 22 L -4 12 Z" fill="#e2e8f0" fill-opacity="0.9"/>
    <line x1="-18" y1="-6" x2="18" y2="-6" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-18" y1="1" x2="8" y2="1" stroke="#475569" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g transform="translate(155 130)" opacity="0.85">
    <rect x="-24" y="-15" width="48" height="26" rx="8" fill="#e2e8f0" fill-opacity="0.85"/>
    <path d="M 10 11 L 14 20 L 4 11 Z" fill="#e2e8f0" fill-opacity="0.85"/>
    <line x1="-14" y1="-5" x2="14" y2="-5" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-14" y1="2" x2="4" y2="2" stroke="#475569" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g fill="#e2e8f0">
    <circle cx="220" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="380" cy="280" r="1.2" opacity="0.7"/>
  </g>
</svg>
