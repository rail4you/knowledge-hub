<div class="major-page">
  <!-- 标题行 -->
  <div class="major-head">
    <h2>专业管理</h2>
    <button class="major-new-btn" (click)="openCreate()">
      <span nz-icon nzType="plus"></span>
      新建专业
    </button>
  </div>

  <!-- 搜索栏 -->
  <div class="major-search">
    <span nz-icon nzType="search" class="mag"></span>
    <input
      type="text"
      placeholder="搜索专业名称或代号"
      [ngModel]="filter()"
      (ngModelChange)="filter.set($event); reload()"
      (keyup.enter)="reload()"
    />
    <button type="button" (click)="reload()">搜索</button>
  </div>

  <!-- 专业列表 -->
  <div class="major-card">
    <table class="major-table">
      <thead>
        <tr>
          <th style="width:30%">专业名称</th>
          <th class="center" style="width:20%">专业代号</th>
          <th class="center" style="width:25%">创建时间</th>
          <th class="center" style="width:25%">操作</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td class="name-cell">{{ item.name }}</td>
            <td class="center code-cell">{{ item.code || '-' }}</td>
            <td class="center time-cell">{{ item.creationTime | date:'yyyy-MM-dd HH:mm' }}</td>
            <td class="center op-cell">
              <span class="op-links">
                <a class="edit" (click)="openEdit(item)">
                  <span nz-icon nzType="edit"></span>编辑
                </a>
                <span class="sep">|</span>
                <a class="del" (click)="delete(item)">
                  <span nz-icon nzType="delete"></span>删除
                </a>
              </span>
            </td>
          </tr>
        }
        @empty {
          <tr>
            <td colspan="4">
              <div class="mgmt-empty">
                <span nz-icon nzType="inbox"></span>
                <span>暂无专业</span>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <nz-modal
    [nzVisible]="modalVisible"
    [nzTitle]="editingId ? '编辑专业' : '新建专业'"
    [nzWidth]="640"
    (nzOnCancel)="modalVisible = false"
    (nzOnOk)="save()"
  >
    <ng-container *nzModalContent>
      <div class="form-grid">
        <label>专业名称 *</label>
        <input nz-input [(ngModel)]="form.name" maxlength="128" placeholder="例如：计算机科学与技术" />

        <label>专业代号</label>
        <input nz-input [(ngModel)]="form.code" maxlength="64" placeholder="可选，例如：CS" />

        <label>培养目标</label>
        <textarea
          nz-input
          [(ngModel)]="form.trainingObjectives"
          maxlength="2000"
          [nzAutosize]="{ minRows: 3, maxRows: 8 }"
          placeholder="本专业的培养目标、毕业要求等"
        ></textarea>

        <label>简介</label>
        <textarea
          nz-input
          [(ngModel)]="form.description"
          maxlength="2000"
          [nzAutosize]="{ minRows: 3, maxRows: 8 }"
          placeholder="专业简介、特色、课程概览等"
        ></textarea>
      </div>
    </ng-container>
  </nz-modal>
</div>
