<div class="page">
  <nz-card>
    <div class="project-selector">
      <label class="selector-label">选择实训项目</label>
      <nz-select [ngModel]="selectedProjectId" (ngModelChange)="onProjectChange($event)" nzPlaceHolder="请选择实训项目" style="width: 360px;">
        <nz-option *ngFor="let p of projects()" [nzValue]="p.id" [nzLabel]="p.title"></nz-option>
      </nz-select>
      <span class="selector-hint" *ngIf="selectedProjectTitle">当前：{{ selectedProjectTitle }}</span>
    </div>
  </nz-card>

  <nz-card *ngIf="selectedProjectId">
    <nz-tabs [(nzSelectedIndex)]="activeTabIndex">
      <nz-tab nzTitle="智能体配置">
        <div class="config-tab">
          <div class="section-header">
            <div>
              <h3>实训智能体配置</h3>
              <span class="hint">学生可在聊天室中 @@ 智能体名称进行提问</span>
            </div>
            <button nz-button nzType="primary" [nzLoading]="agentSaving" (click)="saveAgentConfig()">保存智能体配置</button>
          </div>
          <div class="form-grid agent-config-grid">
            <label>智能体名称</label>
            <input nz-input [(ngModel)]="agentConfigForm.agentName" placeholder="如：小智（默认）" />

            <label>附加提示词</label>
            <textarea nz-input
                      [(ngModel)]="agentConfigForm.agentPrompt"
                      rows="6"
                      placeholder="自定义智能体行为。系统已自动注入项目描述和任务列表。&#10;&#10;例如：你是一个 Java 实训助教，专注于帮助学生理解 Spring Boot 的核心概念。"></textarea>
          </div>
        </div>
      </nz-tab>
      <nz-tab nzTitle="实训聊天">
        <div class="chat-tab">
          <app-practicum-chat [projectId]="selectedProjectId" [embedded]="true"></app-practicum-chat>
        </div>
      </nz-tab>
    </nz-tabs>
  </nz-card>
</div>
