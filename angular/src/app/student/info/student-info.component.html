@if (page(); as p) {
  <div class="info-page">
    <div class="info-content">
      @for (section of p.sections; track section.heading) {
        <section class="info-section">
          <h2 class="info-section__heading">{{ section.heading }}</h2>
          @for (pText of section.paragraphs; track pText) {
            <p class="info-section__text">{{ pText }}</p>
          }
          @if (section.list && section.list.length) {
            <ul class="info-section__list">
              @for (item of section.list; track item) {
                <li>{{ item }}</li>
              }
            </ul>
          }
        </section>
      }
    </div>
  </div>
}
