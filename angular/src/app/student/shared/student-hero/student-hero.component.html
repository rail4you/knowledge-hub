<section class="student-hero">
  <div class="student-hero__bg" aria-hidden="true">
    <span class="student-hero__shape student-hero__shape--1"></span>
    <span class="student-hero__shape student-hero__shape--2"></span>
    <span class="student-hero__shape student-hero__shape--3"></span>
  </div>

  <div class="student-hero__inner">
    <div class="student-hero__body">
      <h1 class="student-hero__title">
        <span class="student-hero__bar" aria-hidden="true"></span>
        {{ title() }}
      </h1>
      @if (description()) {
        <p class="student-hero__desc">{{ description() }}</p>
      }
    </div>

    <div class="student-hero__stats">
      <div class="hero-stats-card">
        <h3 class="hero-stats-card__title">
          <span class="hero-stats-card__bar" aria-hidden="true"></span>
          数据总览
        </h3>
        <div class="hero-stats-grid">
          @for (s of stats(); track s.label) {
            <div class="hero-stat-cell">
              <span class="hero-stat-cell__icon" [style.background]="s.color">
                <span nz-icon [nzType]="s.icon" nzTheme="outline"></span>
              </span>
              <div class="hero-stat-cell__body">
                <div class="hero-stat-cell__value">
                  <strong>{{ s.value | number }}</strong>
                  @if (s.suffix) {
                    <span class="hero-stat-cell__suffix">{{ s.suffix }}</span>
                  }
                </div>
                <span class="hero-stat-cell__label">{{ s.label }}</span>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
