<div class="resources-page">
  <!-- ═══ 页头 ═══ -->
  <header class="page-head">
    <span class="page-head__eyebrow">资源中心</span>
    <h1>按专业、格式与模块，找到可用的教学资源。</h1>
    <p>检索资源名称与简介，或用三级筛选缩小范围。资源均来自联盟已审核通过的资源库。</p>
  </header>

  <!-- ═══ 检索条 + 三级筛选 ═══ -->
  <section class="rs-panel rs-panel--filter">
    <form class="rs-search" (submit)="$event.preventDefault(); onSearch()">
      <label class="sr-only" for="rs-query">搜索资源</label>
      <input
        id="rs-query"
        name="q"
        type="search"
        autocomplete="off"
        placeholder="搜索资源名称、简介…"
        [ngModel]="keyword()"
        (ngModelChange)="keyword.set($event)"
      />
      <button type="submit">
        <span nz-icon nzType="search" nzTheme="outline"></span>
        搜索
      </button>
    </form>

    <div class="rs-filters">
      <label class="rs-field">
        <span>专业方向</span>
        <select
          [ngModel]="majorId() ?? ''"
          (ngModelChange)="setFilter('major', $event)"
          aria-label="按专业方向筛选"
        >
          <option value="">全部专业</option>
          @for (m of majors(); track m.id) {
            <option [value]="m.id">{{ m.name }}</option>
          }
        </select>
      </label>

      <label class="rs-field">
        <span>资源格式</span>
        <select
          [ngModel]="resourceType() ?? ''"
          (ngModelChange)="setFilter('type', $event)"
          aria-label="按资源格式筛选"
        >
          <option value="">全部格式</option>
          @for (t of typeOptions; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </label>

      <label class="rs-field">
        <span>资源模块</span>
        <select
          [ngModel]="categoryId() ?? ''"
          (ngModelChange)="setFilter('category', $event)"
          aria-label="按资源模块筛选"
        >
          <option value="">全部模块</option>
          @for (c of categoryOptions(); track c.id) {
            <option [value]="c.id">{{ c.label }}</option>
          }
        </select>
      </label>

      <button type="button" class="rs-reset" [disabled]="!hasFilters()" (click)="resetFilters()">
        重置筛选
      </button>
    </div>
  </section>

  <!-- ═══ 资源列表 ═══ -->
  <section class="rs-panel">
    <div class="rs-list-head">
      <h2>教学资源</h2>
      <span class="rs-list-head__count">共 {{ totalCount() | number }} 个</span>
    </div>

    @if (loading()) {
      <app-student-skeleton variant="list" [rows]="6" />
    } @else if (loadFailed()) {
      <app-student-error
        title="资源列表加载失败"
        detail="服务暂时没有响应，请稍后重试。"
        (retry)="reload()"
      />
    } @else if (!resources().length) {
      <app-student-empty
        [variant]="hasFilters() ? 'result' : 'data'"
        [title]="hasFilters() ? '没有匹配的资源' : '资源库暂时还没有内容'"
        [description]="
          hasFilters()
            ? '当前筛选条件过窄，试试放宽条件或重置筛选后重新检索。'
            : '联盟审核通过的资源会自动出现在这里，现在可以先去智能检索查找内容。'
        "
        [actionLabel]="hasFilters() ? '重置筛选' : '去智能检索'"
        (action)="hasFilters() ? resetFilters() : goSearch()"
      />
    } @else {
      <div class="rs-list">
        @for (r of resources(); track r.id) {
          <app-student-resource-row
            [resource]="r"
            [collected]="isCollected(r.id)"
            [tenantName]="tenantName()"
            (toggleCollect)="toggleCollect($event)"
          />
        }
      </div>

      <app-student-pagination
        [total]="totalCount()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        (pageChange)="onPageChange($event)"
      />
    }
  </section>
</div>
