<div class="mm-track" [class.mm-track--compact]="compact()">
  @for (s of steps; track s.label; let i = $index) {
    <div class="mm-track__step" [class]="'mm-track__step ' + stepClass(i)">
      <span class="mm-track__dot" aria-hidden="true">{{ i + 1 }}</span>
      <span class="mm-track__label">{{ s.label }}</span>
    </div>
  }
</div>
@if (emptyHint()) {
  <p class="mm-track__hint">{{ emptyHint() }}</p>
}
