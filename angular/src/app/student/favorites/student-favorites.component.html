<div class="favorites-page">
  <!-- ═══ 页头 ═══ -->
  <header class="page-head">
    <span class="page-head__eyebrow">我的收藏</span>
    <h1>把关心的资源，集中收藏。</h1>
    <p>收藏的资源会一直保留在这里，可随时进入详情预览、下载或取消收藏。</p>
  </header>

  <!-- ═══ 检索条 + 筛选 ═══ -->
  <section class="fv-panel fv-panel--filter">
    <form class="fv-search" (submit)="$event.preventDefault(); onSearch()">
      <label class="sr-only" for="fv-query">搜索收藏</label>
      <input
        id="fv-query"
        name="q"
        type="search"
        autocomplete="off"
        placeholder="搜索收藏资源的名称、简介…"
        [ngModel]="keyword()"
        (ngModelChange)="keyword.set($event)"
      />
      <button type="submit">
        <span nz-icon nzType="search" nzTheme="outline"></span>
        搜索
      </button>
    </form>

    <div class="fv-filters">
      <label class="fv-field">
        <span>资源格式</span>
        <select
          [ngModel]="resourceType() ?? ''"
          (ngModelChange)="setFilter('type', $event)"
          aria-label="按资源格式筛选"
        >
          <option value="">全部格式</option>
          @for (t of typeOptions; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </label>

      <label class="fv-field">
        <span>资源模块</span>
        <select
          [ngModel]="categoryId() ?? ''"
          (ngModelChange)="setFilter('category', $event)"
          aria-label="按资源模块筛选"
        >
          <option value="">全部模块</option>
          @for (c of categoryOptions(); track c.id) {
            <option [value]="c.id">{{ c.label }}</option>
          }
        </select>
      </label>

      <button type="button" class="fv-reset" [disabled]="!hasFilters()" (click)="resetFilters()">
        重置筛选
      </button>
    </div>
  </section>

  <!-- ═══ 收藏列表 ═══ -->
  <section class="fv-panel">
    <div class="fv-list-head">
      <h2>收藏的资源</h2>
      <span class="fv-list-head__count">共 {{ totalCount() | number }} 个</span>
    </div>

    @if (loading()) {
      <app-student-skeleton variant="list" [rows]="5" />
    } @else if (loadFailed()) {
      <app-student-error
        title="收藏列表加载失败"
        detail="服务暂时没有响应，请稍后重试。"
        (retry)="reload()"
      />
    } @else if (!resources().length) {
      <app-student-empty
        [variant]="hasFilters() ? 'result' : 'data'"
        [title]="hasFilters() ? '没有匹配的收藏资源' : '还没有收藏任何资源'"
        [description]="
          hasFilters()
            ? '当前筛选条件过窄，试试放宽条件或重置筛选。'
            : '在资源中心点击资源右侧的星标即可收藏，收藏后会显示在这里。'
        "
        [actionLabel]="hasFilters() ? '重置筛选' : '去资源中心'"
        (action)="hasFilters() ? resetFilters() : goResources()"
      />
    } @else {
      <div class="fv-list">
        @for (r of resources(); track r.id) {
          <app-student-resource-row
            [resource]="r"
            [collected]="true"
            (toggleCollect)="toggleCollect($event)"
          />
        }
      </div>

      <app-student-pagination
        [total]="totalCount()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        (pageChange)="onPageChange($event)"
      />
    }
  </section>
</div>
