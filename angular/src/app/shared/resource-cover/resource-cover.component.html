<div class="cover-fill" #host>
  <!-- fallback 垫底：调用方传入的图标 -->
  <div class="cover-fallback">
    <ng-content></ng-content>
  </div>
  <!-- 真实缩略图盖在上层 -->
  @if (loadMedia() && !failed() && mode() !== 'icon' && !mediaProcessing()) {
    <div class="cover-media" [class.cover-media--contain]="fit() === 'contain'">
      <!-- 图片未整图就绪前：占位 loading 盖住渐进式渲染，避免"一部分一部分"的撕裂感 -->
      @if (!mediaLoaded()) {
        <div class="cover-loading" aria-hidden="true">
          <span class="cover-loading__spinner"></span>
        </div>
      }
      @if (mode() === 'video') {
        @if (thumbFailed()) {
          <video
            [src]="previewUrl()"
            [style.object-fit]="fit()"
            preload="metadata"
            muted
            playsinline
            disablepictureinpicture
            (error)="onMediaError()"
          ></video>
        } @else {
          <img [src]="thumbnailUrl()" [alt]="alt()" loading="lazy" decoding="async"
            [style.object-fit]="fit()"
            [class.is-loaded]="mediaLoaded()" (load)="onMediaLoaded()" (error)="onThumbError()" />
        }
      } @else if (mode() === 'image') {
        <img
          [src]="thumbFailed() ? previewUrl() : thumbnailUrl()"
          [alt]="alt()"
          [style.object-fit]="fit()"
          loading="lazy"
          decoding="async"
          [class.is-loaded]="mediaLoaded()"
          (load)="onMediaLoaded()"
          (error)="onThumbError()"
        />
      } @else if (mode() === 'doc') {
        <!-- Office/PDF 服务端首页图；失败回退图标 -->
        <img [src]="thumbnailUrl()" [alt]="alt()" loading="lazy" decoding="async"
          [style.object-fit]="fit()"
          [class.is-loaded]="mediaLoaded()" (load)="onMediaLoaded()" (error)="onMediaError()" />
      }
    </div>
  }

  <!-- 媒体生成中：展示提示，不请求缩略图 -->
  @if (loadMedia() && mediaProcessing()) {
    <div class="cover-processing">
      <span class="cover-processing__spinner"></span>
      <span class="cover-processing__text">生成中</span>
    </div>
  }
</div>
