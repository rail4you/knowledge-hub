<div class="cover-fill" #host>
  <!-- fallback 垫底：调用方传入的图标 -->
  <div class="cover-fallback">
    <ng-content></ng-content>
  </div>
  <!-- 真实缩略图盖在上层；PDF 第一页渲染完成前保持隐藏，露出垫底图标 -->
  @if (loadMedia() && !failed() && mode() !== 'icon' && !mediaProcessing()) {
    <div class="cover-media" [class.is-hidden]="mode() === 'pdf' && !pdfReady()">
      @if (mode() === 'video') {
        @if (thumbFailed()) {
          <video
            [src]="previewUrl()"
            preload="metadata"
            muted
            playsinline
            disablepictureinpicture
            (error)="onMediaError()"
          ></video>
        } @else {
          <img [src]="thumbnailUrl()" [alt]="alt()" loading="lazy" decoding="async" (error)="onThumbError()" />
        }
      } @else if (mode() === 'image') {
        <img
          [src]="thumbFailed() ? previewUrl() : thumbnailUrl()"
          [alt]="alt()"
          loading="lazy"
          decoding="async"
          (error)="onThumbError()"
        />
      } @else if (mode() === 'pdf') {
        <canvas #pdfCanvas></canvas>
      }
    </div>
  }

  <!-- 媒体生成中：展示提示，不请求缩略图 -->
  @if (loadMedia() && mediaProcessing()) {
    <div class="cover-processing">
      <span class="cover-processing__spinner"></span>
      <span class="cover-processing__text">生成中</span>
    </div>
  }
</div>
