<div class="pdf-viewer">
  <!-- Toolbar: zoom only -->
  <div class="viewer-toolbar">
    <div class="toolbar-left">
      <span class="page-info" *ngIf="totalPages() > 0">{{ currentPage() }} / {{ totalPages() }} 页</span>
    </div>
    <div class="toolbar-right">
      <button nz-button nzSize="small" (click)="zoomOut()" [disabled]="scale() <= 0.25">
        <span nz-icon nzType="zoom-out"></span>
      </button>
      <span class="scale-info">{{ getScalePercent() }}%</span>
      <button nz-button nzSize="small" (click)="zoomIn()" [disabled]="scale() >= 3">
        <span nz-icon nzType="zoom-in"></span>
      </button>
      <button nz-button nzSize="small" (click)="fitWidth()">
        <span nz-icon nzType="fullscreen"></span>
      </button>
      <span class="render-progress" *ngIf="renderedCount() > 0 && renderedCount() < totalPages()">
        {{ renderedCount() }}/{{ totalPages() }}
      </span>
    </div>
  </div>

  <!-- Pages container with click-blocking shield inside -->
  <div class="pdf-pages-container" [class.loading]="isLoading()" (scroll)="onScroll()">
    <!-- Transparent shield to block all clicks on PDF content -->
    <div
      class="pdf-click-shield"
      (mousedown)="$event.preventDefault(); $event.stopPropagation()"
      (click)="$event.preventDefault(); $event.stopPropagation()"
      (dblclick)="$event.preventDefault(); $event.stopPropagation()"
      (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
    ></div>

    @for (page of pages(); track page) {
      <div class="pdf-page-wrapper" [style.width.px]="pageWidth()">
        <canvas #pdfCanvas class="pdf-page-canvas"></canvas>
        <div class="pdf-page-label">— {{ page }} —</div>
      </div>
    }
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading()" class="pdf-loading-overlay">
    <div class="pdf-loading-inner">
      <nz-spin nzSimple nzSize="large"></nz-spin>
      <p class="pdf-loading-text">
        {{ renderedCount() > 0 ? '正在渲染 ' + renderedCount() + '/' + totalPages() : '正在加载 PDF…' }}
      </p>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="error()" class="viewer-error">{{ error() }}</div>
</div>
