<header class="top">
  <a routerLink="/" class="brand">
    @if (branding.logoUrl()) {
      <img class="brandmark brandmark--img" [src]="branding.logoUrl()" [alt]="branding.appTitle()" />
    } @else {
      <span class="brandmark" aria-hidden="true">
        <span nz-icon nzType="read" nzTheme="outline"></span>
      </span>
    }
    <span class="brand-text">
      {{ branding.appTitle() }}
      <small>{{ branding.appSubtitle() }}</small>
    </span>
  </a>
  <nav class="top__nav" aria-label="主导航">
    <!--
      全站统一导航：首页、课程中心、资源库、微专业、院校门户、实训、就业
      在所有公开页（门户首页 / 探索页 / 资源库列表与详情 / 院校门户 / 学校简介）完全一致。
      实训 / 就业 属于登录后的模块：未登录点它们先去登录页（带回跳地址），已登录直接进入。
    -->
    <a routerLink="/" [queryParams]="homeSection() ? { section: homeSection() } : {}" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">首页</a>
    <a routerLink="/explore/courses" [class.active]="activeTab() === 'courses'">课程资源库</a>
    <a routerLink="/explore/library" [class.active]="activeTab() === 'library'">共建资源库</a>
    <a routerLink="/explore/micro" [class.active]="activeTab() === 'micro'">微专业</a>
    <a routerLink="/campuses" [class.active]="activeTab() === 'campuses'">院校门户</a>
    <a
      routerLink="/student/practicums"
      (click)="onStudentModuleClick($event, '/student/practicums')"
      >实训</a
    >
    <a
      routerLink="/student/employment/jobs"
      (click)="onStudentModuleClick($event, '/student/employment/jobs')"
      >就业</a
    >
  </nav>
  <div class="top__end">
    @if (isLoggedIn) {
      <span class="top__user">
        <span class="top__avatar">{{ (userName() || '用').slice(0, 1) }}</span>
        <span class="top__username">{{ userName() }}</span>
      </span>
      @if (isStudent) {
        <a routerLink="/student" class="btn btn--primary top__portal">学生门户</a>
      } @else {
        <a routerLink="/resources" class="btn btn--primary top__portal">管理后台</a>
      }
      <button class="btn top__logout" (click)="logout()">退出</button>
    } @else {
      <a routerLink="/register" class="btn top__register">注册</a>
      <button class="btn btn--primary top__portal" (click)="login()">
        登录
      </button>
    }
  </div>
</header>
