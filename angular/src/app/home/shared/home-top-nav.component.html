<header class="top">
  <a routerLink="/" class="brand">
    @if (branding.logoUrl()) {
      <img class="brandmark brandmark--img" [src]="branding.logoUrl()" [alt]="branding.appTitle()" />
    } @else {
      <span class="brandmark" aria-hidden="true">
        <span nz-icon nzType="read" nzTheme="outline"></span>
      </span>
    }
    <span class="brand-text">
      {{ branding.appTitle() }}
      <small>{{ branding.appSubtitle() }}</small>
    </span>
  </a>
  <nav class="top__nav" aria-label="主导航">
    <a routerLink="/" [queryParams]="homeSection() ? { section: homeSection() } : {}" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">首页</a>
    <a routerLink="/explore/courses">课程中心</a>
    <a routerLink="/explore/resources">资源库</a>
    <a routerLink="/explore/micro">微专业</a>
    <a routerLink="/student/practicums">实训</a>
    <a routerLink="/student/employment/jobs">就业</a>
  </nav>
  <div class="top__end">
    @if (isLoggedIn) {
      <span class="top__user">
        <span class="top__avatar">{{ (userName() || '用').slice(0, 1) }}</span>
        <span class="top__username">{{ userName() }}</span>
      </span>
      @if (isStudent) {
        <a routerLink="/student" class="btn btn--primary top__portal">学生门户</a>
      } @else {
        <a routerLink="/resources" class="btn btn--primary top__portal">管理后台</a>
      }
      <button class="btn top__logout" (click)="logout()">退出</button>
    } @else {
      <button class="btn btn--primary top__portal" (click)="login()">
        进入学习空间
        <span nz-icon nzType="right" nzTheme="outline"></span>
      </button>
    }
  </div>
</header>
