<div class="scene-picker">
  <div class="sp-head">
    <span class="sp-title">{{ title() }}</span>
    <button nz-button nzType="link" nzSize="small" (click)="openAdd()">
      <span nz-icon nzType="plus"></span> 添加场景
    </button>
  </div>

  <nz-table
    #sceneTable
    [nzData]="tableScenes()"
    [nzShowPagination]="false"
    nzSize="small"
    [nzLoading]="loading()"
    nzTableLayout="fixed"
    [nzNoResult]="sceneEmptyTpl"
  >
    <thead>
      <tr>
        <th nzWidth="32%">场景名称</th>
        <th nzAlign="center">提示词</th>
        <th nzWidth="220px" nzAlign="center">操作</th>
      </tr>
    </thead>
    <tbody>
      @for (scene of sceneTable.data; track scene.id) {
        <tr>
          <td>
            <span class="sp-name">{{ scene.name }}</span>
          </td>
          <td nzAlign="center">
            <span class="sp-prompt" [title]="scene.prompt">{{ scene.prompt }}</span>
          </td>
          <td nzAlign="center" class="sp-actions">
            <button nz-button nzType="link" nzSize="small" (click)="select(scene)">
              使用
            </button>
            <button nz-button nzType="link" nzSize="small" (click)="openEdit(scene)">
              <span nz-icon nzType="edit"></span> 编辑
            </button>
            <button nz-button nzType="link" nzSize="small" nzDanger (click)="remove(scene)">
              <span nz-icon nzType="delete"></span> 删除
            </button>
          </td>
        </tr>
      }
    </tbody>
    <ng-template #sceneEmptyTpl>
      <span class="sp-empty">暂无场景，点击「添加场景」创建，可从内置模板开始</span>
    </ng-template>
  </nz-table>

  <nz-modal
    [nzVisible]="modalVisible()"
    [nzTitle]="editingId() ? '编辑场景' : '添加场景'"
    [nzOkLoading]="saving()"
    nzOkText="保存"
    nzCancelText="取消"
    (nzVisibleChange)="modalVisible.set($event)"
    (nzOnOk)="save()"
    (nzOnCancel)="closeModal()"
  >
    <ng-container *nzModalContent>
      @if (!editingId()) {
        <div class="sp-form-item">
          <label>选择模板（可选，自动填充下方内容）</label>
          <nz-select
            [ngModel]="templateId()"
            (ngModelChange)="onTemplateChange($event)"
            nzAllowClear
            nzPlaceHolder="从内置教学模板中选择"
            class="sp-select"
          >
            @for (tpl of templateOptions(); track tpl.id) {
              <nz-option [nzValue]="tpl.id" [nzLabel]="tpl.name"></nz-option>
            }
          </nz-select>
          @if (templateOptions().length === 0) {
            <div class="sp-hint">当前分类暂无内置模板</div>
          }
        </div>
      }

      <div class="sp-form-item">
        <label>场景名称 <span class="sp-required">*</span></label>
        <input
          nz-input
          [ngModel]="formName()"
          (ngModelChange)="formName.set($event)"
          maxlength="100"
          placeholder="如：课堂讲解、科学实验"
        />
      </div>
      <div class="sp-form-item">
        <label>提示词 <span class="sp-required">*</span></label>
        <textarea
          nz-input
          [ngModel]="formPrompt()"
          (ngModelChange)="formPrompt.set($event)"
          rows="5"
          maxlength="2000"
          placeholder="描述该教学场景的画面或运镜，使用时会填入提示词输入框"
        ></textarea>
      </div>
    </ng-container>
  </nz-modal>
</div>
